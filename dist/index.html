    out.push(rec('walt', target.upstream ? 'support' : 'caution',
      target.upstream ? 'Burn the high country, not my fence line' : 'Keep it well away from the hay',
      (target.upstream ? target.name + ' is above the reservoir, so if it does escape it is not into my hay meadows. ' : target.name + ' sits above the valley floor and an escape with ' + num(x.wind) + ' mph wind runs straight downslope into cured grass and stacked bales. ') +
      'Grazing after a burn comes back better within two seasons, and a black hillside in fall beats a black valley in July. ' +
      'Just make sure the ' + af(fin(x.demands.fire, 600)) + ' fire reserve is actually in the reservoir before anyone strikes a match.',
      evidence(s, 'fireDanger', 'Fire danger', 'index 0-1', x.fireDanger, 0.5)));

    out.push(rec('naomi', 'support',
      'Good fire is old knowledge',
      'Cultural burning kept these slopes open long before the first decree; low fires in the right season renewed forage, berries and the springs that feed the creek. ' +
      'The load in ' + target.name + ' at ' + num(target.avg * 100) + '% is the debt from a century of putting every fire out. ' +
      'Burn with humility, in ' + (x.season === C.SEASON.SPRING || x.season === C.SEASON.FALL ? 'this' : 'the shoulder') + ' season, and the river will carry less ash for it.',
      evidence(s, 'fuelAvg', 'Mean forest fuel load', 'index 0-1', x.fuel.avg, 0.6)));
    return out;
  };

  TOPIC_FNS.fire_policy = function (x) {
    var s = x.state, out = [];
    var suppress = x.policy === 'suppress_all';
    var worst = x.fuel.worst || { name: 'the upper forest', avg: x.fuel.avg };
    var hardened = Object.keys(obj(x.effects.hardenedZones)).length;

    out.push(rec('dolores', suppress ? 'caution' : 'support',
      suppress ? 'Suppress-all builds the fire that beats us' : 'Managed fire, with a hard line at the WUI',
      'Under suppress-all, fuel accumulates about 1.6 times faster; ' + worst.name + ' is already at ' + num(worst.avg * 100) + '%. ' +
      'Managed fire lets a wet-season lightning start clean up a ridge for free, but I will full-suppress anything within reach of ' + x.wuiName + ' regardless of policy. ' +
      'We have lost ' + Math.round(x.structuresLost) + ' structures so far; the question is which fire you want, the one you choose or the one you get.',
      evidence(s, 'fuelAvg', 'Mean forest fuel load', 'index 0-1', x.fuel.avg, 0.6)));

    out.push(rec('marcus', x.structuresLost > 0 || x.fireDanger > 0.6 ? 'urge' : 'caution',
      x.structuresLost > 0 ? 'Put them out, all of them' : 'Managed sounds fine until it is my street',
      (x.structuresLost > 0 ? 'We have already lost ' + Math.round(x.structuresLost) + ' homes and logged ' + num(x.smokeDays) + ' smoke days; letting anything burn is a hard sell on my block. ' : 'Fire danger is ' + x.dangerLabel + ' and ' + num(x.smokeDays) + ' smoke days so far; a fire allowed to burn for a month is a month of kids indoors. ') +
      (hardened > 0 ? 'Home hardening is funded in ' + hardened + ' neighborhood' + (hardened > 1 ? 's' : '') + ', which makes managed fire easier to accept. ' : 'Nobody has hardened a single neighborhood yet, so the town is the fuel. ') +
      'Public safety scores ' + num(x.outcomes.P) + '.',
      evidence(s, 'fireDanger', 'Fire danger', 'index 0-1', x.fireDanger, 0.6)));

    out.push(rec('ana', suppress ? 'oppose' : 'urge',
      'The forest needs fire more than it needs us',
      'Ecosystem health sits at ' + num(x.outcomes.E) + '. Mixed-severity fire creates the openings, snags and aspen regeneration that elk and cavity nesters depend on; a century of suppression is why crown fires now sterilise whole drainages. ' +
      'Managed fire in the back country with a wet-season start is the cheapest restoration tool we have. ' +
      'Suppress-all trades small fires now for a stand-replacing one later, and that fire is what fills the reservoir with ash.',
      evidence(s, 'fuelAvg', 'Mean forest fuel load', 'index 0-1', x.fuel.avg, 0.6)));

    out.push(rec('priya', x.upstreamAcres > 1000 ? 'caution' : 'support',
      'Judge the policy by what it does to the water',
      'Burned area upstream of the reservoir totals ' + acres(x.upstreamAcres) + ' and mean burn severity on the map is ' + num(x.burnMean * 100) + '%. ' +
      'Low-severity managed fire raises runoff only slightly; high-severity crown fire can raise post-storm sediment tenfold and turbidity is already ' + num(x.turbidity * 100) + '%. ' +
      'The measurement that matters is severity, not acres, so any policy that lowers fuel before the dry years wins on the water balance.',
      evidence(s, 'turbidity', 'Reservoir turbidity', 'index 0-1', x.turbidity, 0.3)));

    out.push(rec('walt', 'caution',
      'Managed above the dam, suppressed above the hay',
      'A fire that runs onto the valley floor in August takes the second cutting with it, and grass fire in ' + num(x.wind) + ' mph wind moves faster than any engine. ' +
      'I can accept managed fire in the upper sectors where fuel is ' + num(worst.avg * 100) + '%, but ' + x.farmName + ' needs a suppression commitment in writing. ' +
      'Insurance on the barns is already asking what the county policy is.',
      evidence(s, 'fireDanger', 'Fire danger', 'index 0-1', x.fireDanger, 0.5)));

    out.push(rec('naomi', suppress ? 'caution' : 'support',
      'Choose the fire that respects the river',
      'Our elders describe fire as a tool that was taken away by law, and the ' + num(x.fuel.avg * 100) + '% fuel load is the result. ' +
      'Managed fire that keeps severity low protects the springs and the trout the community depends on; a suppress-all policy protects houses this year and hands the reservoir an ash load in a dry one. ' +
      'Whatever you choose, make the decision with the people downstream in the room.',
      evidence(s, 'fuelAvg', 'Mean forest fuel load', 'index 0-1', x.fuel.avg, 0.6)));
    return out;
  };

  TOPIC_FNS.flood = function (x) {
    var s = x.state, out = [];
    var scar = x.scarAcres;
    var peakEst = Math.round(120 + scar * 0.55 * Math.max(0.5, x.stormIn / 2));
    var sedEst = Math.round(scar * 0.8 * Math.max(0.5, x.stormIn / 2) * Math.max(0.3, x.burnMean + 0.3));

    out.push(rec('dolores', 'urge',
      'Sirens first, then the basin above town',
      'A ' + num(x.stormIn, 1) + ' in storm on ' + acres(scar) + ' of scar could push peak flow near ' + peakEst.toLocaleString() + ' cfs, versus roughly 120 cfs unburned. ' +
      'Warning markers in ' + x.wuiName + ' cut injury risk by about 80% and a debris basin on the main channel catches the boulders before the bridge. ' +
      'Emergency fund is ' + money(x.emergencyFund) + '; spend it on the things that keep people out of the water.',
      evidence(s, 'fireDanger', 'Fire danger', 'index 0-1', x.fireDanger, 0.5)));

    out.push(rec('priya', 'urge',
      'Protect the intake and put a sensor upstream',
      'Sediment yield from the scar could be on the order of ' + sedEst.toLocaleString() + ' t; even a tenth of that reaching the reservoir lifts turbidity from ' + num(x.turbidity * 100) + '% into treatment-plant trouble. ' +
      'Intake protection at the dam plus a sensor on the river above it halves outage days because the plant can switch or shut before the plume arrives. ' +
      (x.effects.sensorCoverage ? 'Streamgages are funded, so the sensor reading will be trusted.' : 'Without gauges we will be guessing the arrival time.'),
      evidence(s, 'turbidity', 'Reservoir turbidity', 'index 0-1', x.turbidity, 0.3)));

    out.push(rec('ana', x.effects.wetlandRestored ? 'support' : 'urge',
      'Mulch the scar, let the wetland work',
      'Mulch on the burned slopes cuts sediment at the source by roughly 60%, which is worth more to the trout than any wall downstream. ' +
      (x.effects.wetlandRestored ? 'The restored wetland will trap about a third of what passes and knock 30% off the peak. ' : 'A restored wetland would trap about a third of the sediment and cut the peak 30%; it is not funded. ') +
      'Please keep hard bank armour to the reach by the treatment plant; riprap everywhere is a sterile channel for decades.',
      evidence(s, 'turbidity', 'Reservoir turbidity', 'index 0-1', x.turbidity, 0.3)));

    out.push(rec('marcus', x.effects.warningSystem ? 'support' : 'urge',
      x.effects.warningSystem ? 'The sirens are in, now use them' : 'Get a warning into every neighborhood',
      'The storm is ' + Math.round(x.stormTurns) + ' step' + (x.stormTurns === 1 ? '' : 's') + ' out and people in ' + x.wuiName + ' are asking whether to move cars and kids. ' +
      (x.effects.warningSystem ? 'The town-wide warning system is funded; pair it with the marker in each neighborhood so the message is local. ' : 'A warning marker costs a quarter million and covers a whole neighborhood; there is no cheaper life saved. ') +
      'Flood damage so far is ' + money(x.stats.floodDamageM) + ' and none of it was budgeted.',
      evidence(s, 'P', 'Public safety score', '0-100', x.outcomes.P, 60)));

    out.push(rec('walt', 'caution',
      'Barriers on the ditches, not just the canyon',
      'Mud that comes over the headgate fills the lateral ditches for a season and the fields go dry in the middle of irrigation; crop health is ' + num(x.cropHealth * 100) + '% and cannot take that. ' +
      'Log barriers on the side draws above ' + x.farmName + ' are cheap, and I would put two there before a second sensor. ' +
      'Do not spend the whole ' + money(x.emergencyFund) + ' on town; the valley floods too.',
      evidence(s, 'cropHealth', 'Farm crop health', 'index 0-1', x.cropHealth, 0.7)));

    out.push(rec('naomi', 'support',
      'Slow the water, do not fight it',
      'The river is doing what a burned watershed makes it do; the work is to slow it. ' +
      'Mulch, wetland and beaver-style structures keep sediment on the slope and water in the ground, where our people have always understood it belongs; concrete moves the problem to whoever lives below. ' +
      'The scar is ' + acres(scar) + ' and the reservoir is ' + pct(x.storagePct) + ' full; there is room to hold a pulse if it arrives clean.',
      evidence(s, 'storageAF', 'Reservoir storage', 'AF', x.storage, x.capacity)));
    return out;
  };

  TOPIC_FNS.contamination = function (x) {
    var s = x.state, out = [];
    var bad = x.ash > 0.3 || x.turbidity > 0.4;

    out.push(rec('priya', bad ? 'urge' : 'support',
      bad ? 'Treatment capacity is the bottleneck' : 'Watch the decay curve before spending',
      'Turbidity is ' + num(x.turbidity * 100) + '% and ash contamination ' + num(x.ash * 100) + '%; both decay roughly 35% and 25% per season, so without intervention ash is still about ' + num(x.ash * 0.75 * 100) + '% next season. ' +
      (x.effects.multiLevelIntake ? 'The multi-level intake lets the plant draw from the cleanest layer. ' : 'A multi-level intake would let the plant draw clear water from above the plume. ') +
      (x.effects.treatment ? 'The treatment upgrade is in place; outage days so far: ' + Math.round(x.stats.outageDays) + '.' : 'The plant has ' + Math.round(x.stats.outageDays) + ' outage days already; the treatment upgrade is the direct fix.'),
      evidence(s, 'turbidity', 'Reservoir turbidity', 'index 0-1', x.turbidity, 0.4)));

    out.push(rec('marcus', x.stats.outageDays > 0 ? 'urge' : 'caution',
      x.stats.outageDays > 0 ? 'Bottled water is not a plan' : 'Do not let it get to boil notices',
      (x.stats.outageDays > 0 ? 'We have had ' + Math.round(x.stats.outageDays) + ' days of outage or boil notice and the school closed the fountains. ' : 'No outages yet, but ash at ' + num(x.ash * 100) + '% is one storm from a boil notice. ') +
      'Whatever it costs, the treatment upgrade is cheaper than a town of ' + Math.round(x.population).toLocaleString() + ' buying water by the case, and trust (' + num(x.outcomes.T) + ') does not survive brown tap water. ' +
      'Tell people what the numbers mean before they see the colour.',
      evidence(s, 'W', 'Water security score', '0-100', x.outcomes.W, 50)));

    out.push(rec('dolores', 'support',
      'Stop it on the slope',
      'Every ton of ash in the reservoir started on ' + acres(x.scarAcres) + ' of burn scar; mulch and barriers on the steep drainages are the only measures that reduce the next plume rather than treat it. ' +
      'For suppression I can draft turbid water all day, so do not hold the fire reserve for quality reasons. ' +
      'Sediment delivered so far: ' + Math.round(x.stats.sedimentTons).toLocaleString() + ' t.',
      evidence(s, 'turbidity', 'Reservoir turbidity', 'index 0-1', x.turbidity, 0.4)));

    out.push(rec('ana', x.turbidity > 0.3 ? 'urge' : 'support',
      'Turbid water is a fish problem too',
      'Fine sediment at ' + num(x.turbidity * 100) + '% turbidity smothers the gravel where cutthroat spawn and the algae index is ' + num(x.algae * 100) + '%. ' +
      'Releasing a flushing pulse below the dam clears the plant intake faster but scours the redds, so time any flush for late fall after spawning. ' +
      'The lasting fix is upstream: mulch, wetland, riparian shade, not just filters.',
      evidence(s, 'turbidity', 'Reservoir turbidity', 'index 0-1', x.turbidity, 0.3)));

    out.push(rec('walt', 'support',
      'Farms can take the dirty water',
      'Irrigation water does not need to meet drinking standards; if the plant is struggling, route the turbid releases to the ditches and keep the clean layer for town. ' +
      'Farm delivery this season is ' + af(fin(x.delivered.farms, fin(x.demands.farms))) + ' and ash-laden water is fine on hay as long as the headgates do not silt up. ' +
      'Charge the ditch cleaning to the flood account, not to us.',
      evidence(s, 'cropHealth', 'Farm crop health', 'index 0-1', x.cropHealth, 0.7)));

    out.push(rec('naomi', 'caution',
      'What we send downstream is a promise',
      'The delivery obligation is ' + af(H.DOWNSTREAM_AF_YR) + ' a year and it does not say the water may arrive black; communities below us drink from the same relative. ' +
      'Ash at ' + num(x.ash * 100) + '% will pass the dam whether or not the town plant copes, so the measures that matter are the ones that clean the water, not just the ones that protect the intake. ' +
      'Fund the wetland and mulch alongside the plant.',
      evidence(s, 'turbidity', 'Reservoir turbidity', 'index 0-1', x.turbidity, 0.3)));
    return out;
  };

  TOPIC_FNS.drought = function (x) {
    var s = x.state, out = [];
    var severe = x.droughtLevel >= 3 || x.snowpackPct < 70;
    var carryTurns = x.consumptive > 0 ? (x.storage - x.deadPool) / (x.consumptive) : 8;
    carryTurns = C.clamp(fin(carryTurns, 8), 0, 40);

    out.push(rec('priya', severe ? 'urge' : 'caution',
      severe ? 'Plan on the low forecast' : 'Dry, not yet a crisis',
      'Snowpack is ' + pct(x.snowpackPct) + ' of average (' + num(x.swe, 1) + ' in SWE against ' + num(H.AVG_SNOW_SWE_IN) + ' in), drought category ' + x.drought + ', soil moisture ' + pct(x.soil) + '. ' +
      'At current consumptive demand the reservoir has about ' + num(carryTurns, 1) + ' seasons of usable storage above dead pool. ' +
      'Uncertainty is ±' + pct(x.uncertainty * 100) + '; plan on the lower bound, because a second dry winter is the historical norm, not the exception.',
      evidence(s, 'snowpackPct', 'Snowpack, % of average', '%', x.snowpackPct, 70)));

    out.push(rec('walt', x.farmShort > 0.2 ? 'oppose' : 'caution',
      x.farmShort > 0.2 ? 'You cannot dry us up twice' : 'Pay for fallowing, do not order it',
      'Farm shortfall is ' + pct(x.farmShort * 100) + ' and crop health ' + num(x.cropHealth * 100) + '%; hay was already scarce on the Front Range in the last dry year and the price follows the snowpack. ' +
      'If cuts are coming, a voluntary paid fallowing program lets me choose which field to idle and keeps the herd; a mandatory cut sells cows at the bottom of the market. ' +
      'Our decree is senior to the town\'s; do not forget that when the sliders move.',
      evidence(s, 'cropHealth', 'Farm crop health', 'index 0-1', x.cropHealth, 0.7)));

    out.push(rec('marcus', severe && x.restriction === 'none' ? 'support' : (severe ? 'support' : 'oppose'),
      severe ? 'Stage restrictions now, before the panic' : 'Restrictions can wait',
      'Restriction level is "' + x.restriction + '" and household shortfall is ' + pct(x.householdShort * 100) + '. ' +
      (severe ? 'With snowpack at ' + pct(x.snowpackPct) + ', early voluntary or stage-1 rules spread the pain and are far cheaper on the bill than an emergency purchase later. ' : 'The reservoir is ' + pct(x.storagePct) + ' full; asking families to let the yard die now is a trust cost with no water benefit. ') +
      'Say plainly what triggers the next stage.',
      evidence(s, 'storageAF', 'Reservoir storage', 'AF', x.storage, x.capacity * 0.4)));

    out.push(rec('ana', x.streamflow < H.MIN_FLOW_CFS * 1.5 ? 'urge' : 'caution',
      'Drought is when the minimum flow matters most',
      'Flow below the dam is ' + num(x.streamflow) + ' cfs against a ' + H.MIN_FLOW_CFS + ' cfs instream right, and warm low water is how a fish kill starts; the temperature anomaly is ' + (x.tempAnom >= 0 ? '+' : '') + num(x.tempAnom, 1) + ' °F. ' +
      'The wildlife release is non-consumptive; it reaches the state line and counts toward the downstream obligation, so holding it costs the ledger nothing. ' +
      'Elk winter range on the shrub benches is ' + num(x.habitat * 100) + '% quality and drought pushes them into the hayfields, which is Walt\'s problem next.',
      evidence(s, 'streamflowCfs', 'Streamflow below dam', 'cfs', x.streamflow, H.MIN_FLOW_CFS)));

    out.push(rec('naomi', 'caution',
      'Senior rights are not a hardship exemption',
      'The tribal right of ' + af(H.TRIBAL_RIGHT_AF_YR) + ' a year and the ' + af(H.DOWNSTREAM_AF_YR) + ' Colorado River delivery are met before any local shortage is shared; that is settled law and the community will not renegotiate it under pressure. ' +
      'What we will do is conserve alongside you, because the river is a relative in a hard year too. ' +
      'Storage is ' + af(x.storage) + '; show the numbers openly and the sharing goes easier.',
      evidence(s, 'storageAF', 'Reservoir storage', 'AF', x.storage, x.deadPool)));

    out.push(rec('dolores', x.fireDanger > 0.5 ? 'urge' : 'support',
      'Drought is fire season with a different name',
      'Fire danger is ' + x.dangerLabel + ' with soil moisture at ' + pct(x.soil) + ' and fuel at ' + num(x.fuel.avg * 100) + '%; the same numbers that dry the reservoir dry the crowns. ' +
      'Keep the ' + af(fin(x.demands.fire, 600)) + ' reserve whole and do not let the fire stations\' hydrant pressure drop with the pool. ' +
      'Every drought year on record in this state ends with a big fire somewhere.',
      evidence(s, 'fireDanger', 'Fire danger', 'index 0-1', x.fireDanger, 0.5)));
    return out;
  };

  // ---------------------------------------------------------------- API
  function sanitize(r) {
    if (!r.characterId || !CHAR_BY_ID[r.characterId]) r.characterId = CHARACTERS[0].id;
    if (['urge', 'support', 'caution', 'oppose'].indexOf(r.stance) < 0) r.stance = 'caution';
    r.headline = String(r.headline || 'Recommendation');
    r.text = String(r.text || '').replace(/\b(undefined|NaN|null)\b/g, '?');
    var e = r.evidence = obj(r.evidence);
    e.label = String(e.label || 'Measurement'); e.unit = String(e.unit || '');
    e.current = fin(e.current);
    e.series = arr(e.series).map(function (v) { return fin(v); });
    if (e.series.length < 2) e.series = [e.current, e.current];
    if (e.threshold != null && !isFinite(e.threshold)) delete e.threshold;
    return r;
  }

  function getRecommendations(state, world, topic) {
    var fn = TOPIC_FNS[topic] || TOPIC_FNS.budget;
    var x, recs;
    try { x = context(state, world); recs = fn(x); } catch (err) {
      if (WS.DEBUG) console.error('Advisors error', err);
      recs = [];
    }
    recs = arr(recs).map(sanitize);
    if (recs.length < 4) {
      // Should never happen, but keep the contract: pad with neutral, grounded notes.
      var x2;
      try { x2 = x || context(state, world); } catch (err2) { x2 = context({}, {}); }
      var pads = [
        rec('priya', 'caution', 'Check the measurements', 'Storage is ' + af(x2.storage) + ' and snowpack ' + pct(x2.snowpackPct) + '. Decide with the numbers in view.', evidence(state, 'storageAF', 'Reservoir storage', 'AF', x2.storage)),
        rec('dolores', 'caution', 'Watch the fuel', 'Fuel averages ' + num(x2.fuel.avg * 100) + '% and danger is ' + x2.dangerLabel + '.', evidence(state, 'fuelAvg', 'Mean forest fuel load', 'index 0-1', x2.fuel.avg)),
        rec('marcus', 'caution', 'Keep people informed', 'Trust is ' + num(x2.outcomes.T) + '; explain the decision.', evidence(state, 'T', 'Public trust', '0-100', x2.outcomes.T)),
        rec('ana', 'caution', 'Mind the river', 'Flow is ' + num(x2.streamflow) + ' cfs.', evidence(state, 'streamflowCfs', 'Streamflow below dam', 'cfs', x2.streamflow))
      ];
      for (var i = 0; recs.length < 4 && i < pads.length; i++) recs.push(sanitize(pads[i]));
    }
    if (recs.length > 6) recs = recs.slice(0, 6);
    return recs;
  }

  WS.Advisors = {
    CHARACTERS: CHARACTERS,
    TOPICS: TOPICS.slice(),
    byId: function (id) { return CHAR_BY_ID[id] || null; },
    getRecommendations: getRecommendations,
    _series: series,
    _fuelByZone: fuelByZone
  };
})();

</script>
<script>/* src/sim/scoring.js */
/* Watershed — scoring: outcome targets, momentum update, resilience score, grade, final summary. Runs in Node (no DOM). */
(function () {
  'use strict';
  var root = (typeof window !== 'undefined') ? window : globalThis;
  var WS = root.WS = root.WS || {};
  var C = WS.C, L = C.LAND, H = C.HYDRO;

  var MOMENTUM = 0.45;         // fraction of the gap to target closed each season
  var TRUST_ANCHOR = 55;       // trust regresses toward this by ±1 per turn

  function fin(v, d) { return (typeof v === 'number' && isFinite(v)) ? v : (d || 0); }
  function clamp(v, a, b) { v = fin(v, a); return v < a ? a : (v > b ? b : v); }
  function r1(v) { return Math.round(fin(v, 0) * 10) / 10; }
  function pct(v) { return Math.round(clamp(v, 0, 1) * 100); }
  function fx(state) {
    var e = null;
    try { if (WS.Projects && typeof WS.Projects.effects === 'function') e = WS.Projects.effects(state); } catch (err) { e = null; }
    e = e || {};
    return { wetlandRestored: !!e.wetlandRestored, shelters: !!e.shelters, warningSystem: !!e.warningSystem, hardenedZones: e.hardenedZones || {},
      treatment: !!e.treatment, wildlifeCorridor: !!e.wildlifeCorridor, outreach: !!e.outreach, sensorCoverage: fin(e.sensorCoverage, 0) };
  }

  /* world means (typed loops, no allocation) */
  function worldMeans(world) {
    var out = { habitat: 0.5, treeDensity: 0.6, cropHealth: 0.85, burnForestFrac: 0, townFuel: 0.6, wuiHomes: 0, wuiHardened: 0, ok: false };
    if (!world || !world.land) return out;
    var land = world.land, n = land.length, hs = 0, hn = 0, ts = 0, tn = 0, cs = 0, cn = 0, bf = 0;
    for (var i = 0; i < n; i++) {
      var t = land[i];
      if (t === L.RIVER || t === L.RESERVOIR) continue;
      if (world.habitat) { hs += fin(world.habitat[i], 0); hn++; }
      if (t === L.FOREST) { if (world.treeDensity) { ts += fin(world.treeDensity[i], 0); tn++; } if (world.burn && fin(world.burn[i], 0) > 0.3) bf++; }
      if (t === L.FARM && world.cropHealth) { cs += fin(world.cropHealth[i], 0); cn++; }
    }
    out.ok = true;
    if (hn) out.habitat = hs / hn;
    if (tn) { out.treeDensity = ts / tn; out.burnForestFrac = bf / tn; }
    if (cn) out.cropHealth = cs / cn;
    // fuel in forest sectors above town (not upstream of the reservoir)
    var zones = Array.isArray(world.zones) ? world.zones : [], fs = 0, fn = 0;
    for (i = 0; i < zones.length; i++) {
      var z = zones[i];
      if (!z || z.type !== 'forest' || z.upstreamOfReservoir || !z.cells || !world.fuel) continue;
      for (var j = 0; j < z.cells.length; j++) { fs += fin(world.fuel[z.cells[j]], 0); fn++; }
    }
    if (fn) out.townFuel = fs / fn;
    return out;
  }
  function wuiShare(world, hardened) {
    if (!world || !Array.isArray(world.zones)) return 0;
    var zones = world.zones, homes = 0, hard = 0, wui = {};
    for (var i = 0; i < zones.length; i++) { var z = zones[i]; if (z && z.type === 'neighborhood' && (z.wui || /Marshall/.test(z.name || ''))) wui[z.id] = true; }
    var ids = Object.keys(wui);
    if (!ids.length) { for (i = 0; i < zones.length; i++) if (zones[i] && zones[i].type === 'neighborhood') wui[zones[i].id] = true; }
    for (i = 0; i < zones.length; i++) {
      z = zones[i]; if (!z || !wui[z.id]) continue;
      var cnt = z.cells ? z.cells.length : 1; homes += cnt; if (hardened && hardened[z.id]) hard += cnt;
    }
    return homes ? hard / homes : 0;
  }

  function targets(state, world, rep, extras) {
    var o = state.outcomes || {}, r = state.reservoir || {}, cl = state.climate || {}, w = state.water || {}, f = fx(state);
    var flags = state.flags || {}, stats = state.stats || {}, fire = state.fire || {};
    var wm = worldMeans(world);
    rep = rep || state.lastSeasonReport || {};
    extras = extras || {};
    var flood = extras.flood || null, fireRep = extras.fire || null;
    // baselines recorded on first call so we can measure "vs initial"
    if (!isFinite(flags.habitatInit)) flags.habitatInit = Math.max(0.05, wm.habitat);
    if (!isFinite(flags.treeDensityInit)) flags.treeDensityInit = Math.max(0.05, wm.treeDensity);

    var cap = Math.max(1, fin(r.capacityAF, H.RESERVOIR_CAPACITY_AF));
    var storageFrac = clamp(fin(r.storageAF, 0) / cap, 0, 1.2);
    var sp = rep.shortagePct || {};
    var hhShort = clamp(fin(sp.households, 0), 0, 1), farmShort = clamp(fin(sp.farms, 0), 0, 1);
    var ash = clamp(fin(r.ashContam, 0), 0, 1), turb = clamp(fin(r.turbidity, 0), 0, 1);
    var outageDays = fin(flags.outageDaysThisTurn, 0);

    // ---- W: Water Security ----
    var W = 100 * (0.45 * clamp(storageFrac / 0.8, 0, 1) + 0.35 * (1 - hhShort) + 0.2 * (1 - ash)) - Math.min(25, outageDays * 1.5) - 8 * turb;
    if (w.restriction === 'stage2') W -= 4; else if (w.restriction === 'stage1') W -= 2;
    if (cl.drought === 'D3') W -= 2; else if (cl.drought === 'D4') W -= 4;

    // ---- E: Ecosystem Health ----
    var streak = fin(flags.minFlowStreak, 0);
    var flowScore = rep.minFlowMet === false ? 0.15 : clamp(0.4 + streak / 6, 0, 1);
    var habitatScore = clamp(wm.habitat / flags.habitatInit, 0, 1.15);
    var treeScore = clamp(wm.treeDensity / flags.treeDensityInit, 0, 1.1);
    var burnScore = clamp(1 - 2.2 * wm.burnForestFrac, 0, 1);
    var E = 100 * (0.25 * flowScore + 0.2 * habitatScore + 0.2 * treeScore + 0.15 * (1 - turb) + 0.1 * (f.wetlandRestored ? 1 : 0.35) + 0.1 * burnScore)
      - 10 * clamp(fin(r.algae, 0), 0, 1) + (f.wildlifeCorridor ? 4 : 0) - (flags.musselsEstablished ? 8 : 0);

    // ---- P: Public Safety ----
    var structures = fin(fire.structuresLost, 0), floodDamage = fin(stats.floodDamageM, 0), smoke = fin(fire.smokeDays, 0);
    var hardShare = wuiShare(world, f.hardenedZones);
    var dangerNearTown = clamp(fin(cl.fireDanger, 0), 0, 1) * clamp(wm.townFuel / 0.65, 0, 1.4);
    var P = 88 - Math.min(30, structures * 0.4) - Math.min(25, floodDamage * 1.5) - (f.shelters ? 0 : Math.min(15, smoke * 0.3))
      + (f.warningSystem ? 5 : 0) + (f.shelters ? 4 : 0) + 10 * hardShare - 15 * dangerNearTown;
    if (flood) P -= Math.min(15, 20 * clamp(fin(flood.injuriesRisk, 0), 0, 1)) + Math.min(10, fin(flood.floodedHouses, 0) * 0.3);
    if (fireRep) P -= Math.min(12, fin(fireRep.structuresLost, 0) * 0.6);
    if (flags.subdivisionApproved) P -= 4;
    if (flags.insuranceRetreat) P -= 5;
    if (f.outreach) P += 2;

    // ---- F: Food & Economy ----
    var crop = clamp(fin(rep.cropHealthAvg, wm.cropHealth), 0, 1);
    var rec = clamp(fin(rep.recreationIndex, 0.6), 0, 1);
    var hydroScore = clamp(fin(rep.hydroMWh, 200) / 350, 0, 1);
    var econ = 0.7 + (flags.tourismBoom ? 0.2 : 0) + (flags.federalGrant ? 0.1 : 0) - (flags.insuranceRetreat ? 0.25 : 0) - (flags.wellFailures ? 0.1 : 0);
    var F = 100 * (0.35 * clamp(crop / 0.85, 0, 1) + 0.2 * (1 - farmShort) + 0.2 * rec + 0.1 * hydroScore + 0.15 * clamp(econ, 0, 1));
    if (flood) F -= Math.min(20, 2 * fin(flood.damageM, 0));
    if (fireRep) F -= Math.min(10, fin(fireRep.acres, 0) / 2000);
    F -= Math.min(12, outageDays * 0.6);

    return {
      W: clamp(W, 0, 100), E: clamp(E, 0, 100), P: clamp(P, 0, 100), F: clamp(F, 0, 100),
      ctx: { storageFrac: storageFrac, hhShort: hhShort, farmShort: farmShort, ash: ash, turb: turb, outageDays: outageDays, streak: streak, minFlowMet: rep.minFlowMet,
        habitatScore: habitatScore, treeScore: treeScore, burnForestFrac: wm.burnForestFrac, wetland: f.wetlandRestored, algae: fin(r.algae, 0),
        structures: structures, floodDamage: floodDamage, smoke: smoke, shelters: f.shelters, warning: f.warningSystem, hardShare: hardShare, dangerNearTown: dangerNearTown,
        flood: flood, fireRep: fireRep, crop: crop, rec: rec, hydroMWh: fin(rep.hydroMWh, 0), restriction: w.restriction, drought: cl.drought }
    };
  }

  function dirWord(d) { return d > 0.05 ? 'rose' : d < -0.05 ? 'fell' : 'held steady'; }
  function reasonText(key, before, after, tg, c) {
    var d = after - before, head = C.OUTCOME_NAMES[key] + ' ' + dirWord(d) + (Math.abs(d) >= 0.05 ? ' ' + Math.abs(r1(d)).toFixed(1) : '') + ' (target ' + Math.round(tg) + '): ';
    var parts = [];
    if (key === 'W') {
      parts.push('reservoir at ' + pct(c.storageFrac) + '% of capacity');
      parts.push(c.hhShort > 0.005 ? 'households short ' + pct(c.hhShort) + '%' : 'households fully supplied');
      if (c.ash > 0.02) parts.push('ash contamination ' + pct(c.ash) + '%');
      if (c.turb > 0.15) parts.push('turbidity ' + pct(c.turb) + '%');
      if (c.outageDays > 0) parts.push(c.outageDays + ' days of treatment outage');
      if (c.restriction && c.restriction !== 'none') parts.push(c.restriction + ' restrictions in force');
      if (c.drought && c.drought !== 'None') parts.push('drought ' + c.drought);
    } else if (key === 'E') {
      parts.push(c.minFlowMet === false ? 'instream flow right not met' : 'minimum flow met ' + c.streak + ' season' + (c.streak === 1 ? '' : 's') + ' running');
      parts.push('habitat at ' + pct(c.habitatScore) + '% of its starting level');
      parts.push('forest canopy at ' + pct(c.treeScore) + '% of its starting density');
      if (c.burnForestFrac > 0.01) parts.push(pct(c.burnForestFrac) + '% of forest burned');
      if (c.turb > 0.15) parts.push('turbidity ' + pct(c.turb) + '%');
      if (c.algae > 0.3) parts.push('algae ' + pct(c.algae) + '%');
      parts.push(c.wetland ? 'wetland restored' : 'wetland not yet restored');
    } else if (key === 'P') {
      parts.push(c.structures > 0 ? c.structures + ' structures lost to fire so far' : 'no structures lost to fire');
      if (c.floodDamage > 0) parts.push('$' + r1(c.floodDamage).toFixed(1) + 'M of flood damage so far');
      if (c.smoke > 0) parts.push(c.smoke + ' smoke days' + (c.shelters ? ' (shelters open)' : ' without clean-air shelters'));
      parts.push('fire danger near town ' + pct(c.dangerNearTown) + '%');
      if (c.hardShare > 0) parts.push(pct(c.hardShare) + '% of WUI homes hardened');
      if (c.warning) parts.push('warning system in place');
      if (c.flood) parts.push('this storm flooded ' + fin(c.flood.floodedHouses, 0) + ' homes');
      if (c.fireRep) parts.push('this fire burned ' + Math.round(fin(c.fireRep.acres, 0)).toLocaleString() + ' acres');
    } else if (key === 'F') {
      parts.push('crop health ' + pct(c.crop) + '%');
      parts.push(c.farmShort > 0.005 ? 'farms short ' + pct(c.farmShort) + '%' : 'farms fully supplied');
      parts.push('recreation index ' + pct(c.rec) + '%');
      parts.push(Math.round(c.hydroMWh) + ' MWh of hydropower');
      if (c.flood) parts.push('$' + r1(fin(c.flood.damageM, 0)).toFixed(1) + 'M storm damage this season');
      if (c.outageDays > 0) parts.push('businesses lost ' + c.outageDays + ' days to the boil-water notice');
    }
    return head + parts.join(', ') + '.';
  }

  var Scoring = WS.Scoring = {
    MOMENTUM: MOMENTUM, TRUST_ANCHOR: TRUST_ANCHOR,

    /** updateOutcomes(state, world, seasonReport, extras) → { before, after, delta, reasons:[{key,text,delta}] } */
    updateOutcomes: function (state, world, seasonReport, extras) {
      if (!state) return { before: {}, after: {}, delta: {}, reasons: [] };
      var o = state.outcomes = state.outcomes || {};
      var keys = C.OUTCOME_KEYS, before = {}, after = {}, delta = {}, reasons = [], i, k;
      for (i = 0; i < keys.length; i++) { k = keys[i]; o[k] = clamp(o[k], 0, 100); before[k] = o[k]; }
      var tg = targets(state, world, seasonReport, extras);
      for (i = 0; i < 4; i++) {
        k = keys[i];
        after[k] = clamp(before[k] + (tg[k] - before[k]) * MOMENTUM, 0, 100);
        delta[k] = r1(after[k] - before[k]);
        reasons.push({ key: k, text: reasonText(k, before[k], after[k], tg[k], tg.ctx), delta: delta[k] });
      }
      // Trust: accumulated deltas this turn + slow regression toward the anchor
      var td = clamp(fin(state.trustDelta, 0), -25, 25);
      var reg = before.T > TRUST_ANCHOR + 1 ? -1 : before.T < TRUST_ANCHOR - 1 ? 1 : 0;
      after.T = clamp(before.T + td + reg, 0, 100);
      delta.T = r1(after.T - before.T);
      var tParts = [];
      if (Math.abs(td) >= 0.05) tParts.push((td > 0 ? '+' : '') + r1(td).toFixed(1) + ' from this season\'s decisions and service');
      if (reg !== 0) tParts.push((reg > 0 ? '+1 as memories of past trouble fade' : '-1 as goodwill drifts back toward normal'));
      if (seasonReport && seasonReport.legalOverride) tParts.push('senior water rights were overridden');
      if (seasonReport && seasonReport.shortagePct && fin(seasonReport.shortagePct.households, 0) > 0.05) tParts.push('household shortages');
      if (fin(tg.ctx.outageDays, 0) > 0) tParts.push('a boil-water notice');
      reasons.push({ key: 'T', text: C.OUTCOME_NAMES.T + ' ' + dirWord(delta.T) + (Math.abs(delta.T) >= 0.05 ? ' ' + Math.abs(delta.T).toFixed(1) : '') + ': ' + (tParts.length ? tParts.join('; ') : 'no notable events') + '; trust now ' + Math.round(after.T) + '.', delta: delta.T });
      state.trustDelta = 0;
      if (state.flags) state.flags.outageDaysThisTurn = 0;
      for (i = 0; i < keys.length; i++) { k = keys[i]; o[k] = Math.round(after[k] * 10) / 10; after[k] = o[k]; }
      state.resilience = Scoring.resilience(o);
      return { before: before, after: after, delta: delta, reasons: reasons, targets: { W: r1(tg.W), E: r1(tg.E), P: r1(tg.P), F: r1(tg.F) } };
    },

    /** resilience(outcomes) → 0..100 weighted sum */
    resilience: function (outcomes) {
      outcomes = outcomes || {};
      var sum = 0, wsum = 0;
      for (var i = 0; i < C.OUTCOME_KEYS.length; i++) { var k = C.OUTCOME_KEYS[i], w = C.OUTCOME_WEIGHTS[k]; sum += w * clamp(outcomes[k], 0, 100); wsum += w; }
      return wsum > 0 ? Math.round(sum / wsum * 10) / 10 : 0;
    },

    /** grade(R) → { letter, title, R } */
    grade: function (R) {
      R = clamp(R, 0, 100);
      var g = R >= 90 ? ['A', 'Watershed Steward'] : R >= 80 ? ['B', 'Resilient Community'] : R >= 70 ? ['C', 'Holding Steady'] : R >= 60 ? ['D', 'Strained Basin'] : ['F', 'Crisis Basin'];
      return { letter: g[0], title: g[1], R: Math.round(R * 10) / 10 };
    },

    /** finalSummary(state) → { R, grade, outcomes, highlights, lessons, stats } */
    finalSummary: function (state) {
      state = state || {};
      var o = state.outcomes || {}, stats = state.stats || {}, fire = state.fire || {}, flags = state.flags || {}, hist = Array.isArray(state.history) ? state.history : [];
      var R = Scoring.resilience(o), g = Scoring.grade(R), highlights = [], lessons = [];
      var fires = Array.isArray(fire.fires) ? fire.fires : [], biggest = null;
      for (var i = 0; i < fires.length; i++) if (fires[i] && (!biggest || fin(fires[i].acres, 0) > fin(biggest.acres, 0))) biggest = fires[i];
      var minStore = null;
      for (i = 0; i < hist.length; i++) if (hist[i] && (!minStore || fin(hist[i].storageAF, 1e9) < fin(minStore.storageAF, 1e9))) minStore = hist[i];
      var cap = Math.max(1, fin(state.reservoir && state.reservoir.capacityAF, H.RESERVOIR_CAPACITY_AF));
      var yearsPlayed = Math.max(1, Math.floor(fin(state.turn, 0) / 4));

      highlights.push('Colorado Resilience Score ' + g.R + ' — grade ' + g.letter + ', "' + g.title + '" after ' + yearsPlayed + ' year' + (yearsPlayed === 1 ? '' : 's') + '.');
      if (biggest) highlights.push('Largest wildfire: ' + Math.round(fin(biggest.acres, 0)).toLocaleString() + ' acres in year ' + fin(biggest.year, 1) + (fin(biggest.structures, 0) > 0 ? ', ' + biggest.structures + ' structures lost' : '') + '. Total burned: ' + Math.round(fin(fire.totalAcres, 0)).toLocaleString() + ' acres.');
      else highlights.push('No wildfire reached the map in ' + yearsPlayed + ' years — fuels kept accumulating quietly.');
      if (minStore) highlights.push('Reservoir low point: ' + Math.round(fin(minStore.storageAF, 0)).toLocaleString() + ' AF (' + Math.round(100 * fin(minStore.storageAF, 0) / cap) + '% of capacity) in year ' + fin(minStore.year, 1) + '.');
      if (fin(stats.floodDamageM, 0) > 0) highlights.push('Post-fire floods caused $' + r1(stats.floodDamageM).toFixed(1) + 'M in damage and moved ' + Math.round(fin(stats.sedimentTons, 0)).toLocaleString() + ' tons of sediment.');
      if (fin(stats.contaminationOutageDays, 0) > 0) highlights.push('The treatment plant was offline ' + Math.round(stats.contaminationOutageDays) + ' days because of ash and sediment.');
      highlights.push('Hydropower generated ' + Math.round(fin(stats.hydroMWh, 0)).toLocaleString() + ' MWh; ' + Math.round(fin(stats.recreationVisits, 0)).toLocaleString() + ' recreation visits.');
      var funded = state.projects && state.projects.funded ? Object.keys(state.projects.funded) : [];
      if (funded.length) highlights.push('Projects funded: ' + funded.join(', ') + '.');

      if (fin(o.W, 0) < 60) lessons.push('Water security slipped: storage and clean supply need more margin. Leak detection, efficient irrigation and a protected intake buy resilience before a dry year, not during one.');
      else lessons.push('Storage carried you through dry seasons. In Colorado, a reservoir is a buffer against variable snowpack — keep it full going into summer.');
      if (fin(stats.contaminationOutageDays, 0) > 0) lessons.push('Ash and sediment after a fire are a drinking-water problem, not just a flood problem. Mulching the scar, debris basins and intake protection keep the plant running.');
      if (fin(fire.totalAcres, 0) > 5000) lessons.push('Fuel treatments and prescribed fire in the sectors above the reservoir reduce severity, and severity is what turns rain into mudflows.');
      else if (!biggest) lessons.push('A quiet fire history is not safety: fuels build each year, especially under suppress-everything policies.');
      if (flags.legalOverrides || (state.timeline || []).length === 0) lessons.push('Senior rights — the tribal right and the Colorado River delivery — are met first under prior appropriation; planning around them protects trust.');
      if (fin(o.E, 0) < 55) lessons.push('Ecosystems recover slowly: keeping the 14 cfs instream flow and restoring the wetland improves habitat and traps sediment for free during storms.');
      if (fin(o.T, 0) < 50) lessons.push('Trust drops fast under shortages and boil-water notices and returns slowly; outreach and reliable service matter as much as engineering.');
      if (fin(o.F, 0) < 55) lessons.push('Farms and tourism feel drought first. Efficient irrigation and a full recreation pool keep the local economy working.');
      lessons.push('Resilience = 0.25 W + 0.20 E + 0.20 P + 0.20 F + 0.15 T — no single outcome can carry the score.');

      return { R: R, grade: g, outcomes: { W: fin(o.W, 0), E: fin(o.E, 0), P: fin(o.P, 0), F: fin(o.F, 0), T: fin(o.T, 0) }, highlights: highlights, lessons: lessons,
        stats: { floodDamageM: fin(stats.floodDamageM, 0), sedimentTons: fin(stats.sedimentTons, 0), contaminationOutageDays: fin(stats.contaminationOutageDays, 0),
          cropLossPct: fin(stats.cropLossPct, 0), hydroMWh: fin(stats.hydroMWh, 0), recreationVisits: fin(stats.recreationVisits, 0),
          totalAcres: fin(fire.totalAcres, 0), structuresLost: fin(fire.structuresLost, 0), fires: fires.length, years: yearsPlayed } };
    }
  };
})();

</script>
<script>/* src/sim/casestudies.js */
/* Watershed — Case studies. Real Colorado events unlocked by what the player just experienced.
   Exports WS.CaseStudies = { LIST, byId(id), checkUnlocks(state, world), linkTo(id, state) }. Runs in Node (no DOM).
   Figures are deliberately approximate ("about", "roughly") and conservative. */
(function () {
  'use strict';
  var root = (typeof window !== 'undefined') ? window : globalThis;
  var WS = root.WS = root.WS || {};
  var C = WS.C;
  var fmt = C.fmt;
  var H = C.HYDRO;

  // ---------------------------------------------------------------- helpers
  function fin(v, d) { v = Number(v); return isFinite(v) ? v : (d == null ? 0 : d); }
  function obj(o) { return (o && typeof o === 'object') ? o : {}; }
  function arr(a) { return Array.isArray(a) ? a : []; }
  function acres(v) { return Math.round(fin(v)).toLocaleString() + ' acres'; }
  function fires(state) { return arr(obj(obj(state).fire).fires).map(obj); }
  function stats(state) { return obj(obj(state).stats); }
  function flags(state) { return obj(obj(state).flags); }
  function climate(state) { return obj(obj(state).climate); }
  function water(state) { return obj(obj(state).water); }
  function funded(state, id) {
    var f = obj(obj(obj(state).projects).funded)[id];
    return !!(f && (f.level == null || fin(f.level) > 0));
  }
  function effects(state) {
    try { if (WS.Projects && typeof WS.Projects.effects === 'function') return obj(WS.Projects.effects(state)); } catch (e) { /* ignore */ }
    return {};
  }
  function droughtLevel(state) {
    var m = /D([0-4])/.exec(String(climate(state).drought || ''));
    return m ? Number(m[1]) + 1 : 0;
  }
  function zoneTypes(world) {
    var map = {};
    arr(obj(world).zones).forEach(function (z) { if (z && z.id != null) map[z.id] = z.type; });
    return map;
  }
  function biggestFire(state) {
    var best = null;
    fires(state).forEach(function (f) { if (!best || fin(f.acres) > fin(best.acres)) best = f; });
    return best;
  }
  function fireTouchedNeighborhood(state, world) {
    var types = zoneTypes(world), hit = false;
    fires(state).forEach(function (f) { arr(f.zoneIds).forEach(function (id) { if (types[id] === 'neighborhood') hit = true; }); });
    return hit;
  }
  function totalStructures(state) {
    var n = fin(obj(obj(state).fire).structuresLost);
    fires(state).forEach(function (f) { n = Math.max(n, fin(f.structures)); });
    return n;
  }
  function householdShortagePct(state) {
    var w = water(state), d = fin(obj(w.demands).households), s = fin(obj(w.shortage).households);
    return d > 0 ? 100 * s / d : 0;
  }
  function legalOverride(state) {
    var st = obj(state), fl = flags(state), w = water(state), al = obj(w.alloc);
    if (fl.legalOverride || fin(fl.legalOverrides) > 0) return true;
    if (obj(st.lastSeasonReport).legalOverride) return true;
    if (fin(al.tribal, 1) < 0.999 || fin(al.downstream, 1) < 0.999) return true;
    return false;
  }
  function musselEvent(state) {
    var fl = flags(state);
    return !!(fl.musselEvent || fl.musselDetected || fl.musselInspection || fl.musselsFound || funded(state, 'mussel_inspection'));
  }
  function wetlandRestored(state) {
    return !!(flags(state).wetlandRestored || effects(state).wetlandRestored || funded(state, 'wetland'));
  }
  function contaminationOutage(state) {
    return fin(stats(state).contaminationOutageDays) > 0 || fin(flags(state).contaminationEvents) > 0 || fin(obj(obj(state).reservoir).ashContam) > 0.35;
  }

  // ---------------------------------------------------------------- list
  var LIST = [
    {
      id: 'cameron_peak', title: 'Cameron Peak Fire', year: 2020, region: 'Larimer County, Cache la Poudre watershed',
      summary: 'The Cameron Peak Fire started in August 2020 west of Fort Collins and burned into December, reaching about 208,000 acres, the largest wildfire in Colorado history. Much of it burned in the Cache la Poudre and Big Thompson watersheds that supply Fort Collins, Greeley and northern Colorado farms. In the following summers, storms over the burn scar sent ash, sediment and debris into the Poudre; a July 2021 debris flow in the canyon was deadly, and river turbidity spikes at times forced utilities to stop drawing from the river and rely on stored water. Recovery work, including mulching and stream restoration, has cost tens of millions of dollars and continues.',
      lesson: 'A fire in the watershed is a water-supply event that keeps happening for years after the flames are out.',
      unlock: function (state) { return fires(state).length >= 1; },
      linkTo: function (state) {
        var f = biggestFire(state);
        return f ? 'Your ' + acres(f.acres) + ' fire' + (f.upstream ? ' burned above the reservoir, ' : ' ') + 'is the same chain of events at valley scale: the burn scar, not the flames, is what your water supply will remember.' : 'When a fire burns in your upper sectors, this is the story of what comes next.';
      }
    },
    {
      id: 'east_troublesome', title: 'East Troublesome Fire', year: 2020, region: 'Grand County and Rocky Mountain National Park',
      summary: 'In October 2020 the East Troublesome Fire, burning in drought-cured and beetle-killed lodgepole, exploded on strong winds and grew by roughly 100,000 acres in about a day, running some 17 miles toward Grand Lake and jumping the Continental Divide into Rocky Mountain National Park. It burned about 193,000 acres, the second-largest fire in state history, destroyed several hundred homes and killed two residents. Snow finally slowed it. It burned the headwaters of the Colorado River above Grand Lake and Shadow Mountain reservoirs, part of the Colorado-Big Thompson system that moves water to the Front Range.',
      lesson: 'Under extreme wind and dry fuel, a fire can outrun any response in a single afternoon, so preparation has to happen before the smoke.',
      unlock: function (state, world) {
        var big = false;
        fires(state).forEach(function (f) { if (fin(f.acres) >= 2000 && fin(f.structures) >= 1) big = true; });
        return big || totalStructures(state) >= 20 || fireTouchedNeighborhood(state, world);
      },
      linkTo: function (state) {
        var f = biggestFire(state);
        return f ? 'Your fire reached ' + acres(f.acres) + ' and cost ' + Math.round(fin(f.structures)) + ' structure' + (fin(f.structures) === 1 ? '' : 's') + '; East Troublesome shows how a run like that happens in hours when wind and fuel line up.' : 'When a fast fire reaches homes, this is the comparison.';
      }
    },
    {
      id: 'marshall', title: 'Marshall Fire', year: 2021, region: 'Boulder County: Louisville, Superior and unincorporated areas',
      summary: 'On December 30, 2021, a grass fire driven by winds gusting over 100 mph tore through suburban Louisville, Superior and nearby neighborhoods in a few hours. It burned only about 6,000 acres but destroyed more than 1,000 homes and killed two people, making it the most destructive wildfire in Colorado history. The second half of 2021 had been unusually warm and dry, with almost no snow on the ground; snow fell the next day. Homes ignited from embers and from neighboring houses, not from a forest, and home-to-home spread did most of the damage.',
      lesson: 'Wildfire risk is about wind, dry fuel and how homes are built and spaced, not only about trees.',
      unlock: function (state, world) { return totalStructures(state) >= 20 || fireTouchedNeighborhood(state, world); },
      linkTo: function (state) {
        var n = totalStructures(state);
        return 'You have lost ' + Math.round(n) + ' structure' + (n === 1 ? '' : 's') + ' to fire; the Marshall Fire is the reminder that once fire enters a neighborhood, the houses themselves become the fuel.';
      }
    },
    {
      id: 'colorado_river', title: 'Colorado River shortage and the 1922 Compact', year: 2022, region: 'Colorado River Basin, seven states and Mexico',
      summary: 'The Colorado River supplies roughly 40 million people and millions of irrigated acres. The 1922 Colorado River Compact divided about 15 million acre-feet a year between the Upper and Lower Basins based on an unusually wet period; the river has averaged well below that in the 21st century. Colorado, an Upper Basin state, must help ensure deliveries at Lee Ferry. After two decades of drought and warming, Lake Powell and Lake Mead fell to record lows in 2022, near a quarter full, threatening hydropower and forcing the first federal shortage declarations and emergency cuts.',
      lesson: 'When a river is promised more water than it carries, every local shortage is also a downstream obligation.',
      unlock: function (state) { return householdShortagePct(state) > 0.5 || droughtLevel(state) >= 3 || fin(flags(state).droughtDeclared) > 0 || flags(state).droughtDeclared === true; },
      linkTo: function (state) {
        var sp = fin(climate(state).snowpackPct, 100), d = climate(state).drought || 'None';
        return 'Snowpack at ' + fmt.pct(sp) + ' and drought category ' + d + ' in your valley while ' + fmt.af(H.DOWNSTREAM_AF_YR) + ' a year must still pass the dam: that is the Compact at the scale of one tributary.';
      }
    },
    {
      id: 'shoshone', title: 'The Shoshone water right', year: 1902, region: 'Glenwood Canyon, Colorado River',
      summary: 'The Shoshone hydroelectric plant in Glenwood Canyon holds one of the most senior large water rights on the Colorado River in Colorado, with a priority dating to 1902 for about 1,250 cfs. It is non-consumptive: water runs through the turbines and returns to the river. When the plant places a "call", upstream junior rights, including some Front Range transmountain diversions, must let water pass, keeping flows through the canyon for fish, rafting and West Slope users. In an agreement announced in late 2023 and advanced through 2024, the Colorado River Water Conservation District moved to buy the rights from Xcel Energy for roughly $99 million to keep that water in the river permanently.',
      lesson: 'Seniority, not need, decides who gets water in a dry year, and a senior non-consumptive right can protect a whole river reach.',
      unlock: function (state) { return legalOverride(state); },
      linkTo: function (state) {
        var al = obj(water(state).alloc);
        var t = fin(al.tribal, 1), d = fin(al.downstream, 1);
        return 'You set the tribal right to ' + fmt.pct(t * 100) + ' and the downstream delivery to ' + fmt.pct(d * 100) + '; like a Shoshone call, senior rights are delivered regardless, and the ' + fmt.af(H.TRIBAL_RIGHT_AF_YR) + ' tribal decree comes before the town.';
      }
    },
    {
      id: 'monitoring', title: 'Streamgages and SNOTEL', year: 2024, region: 'Colorado and the western United States',
      summary: 'Colorado\'s water decisions rest on two measurement networks. The U.S. Geological Survey and the Colorado Division of Water Resources operate hundreds of streamgages in the state, most reporting near real time, and the USGS runs more than 8,000 gauges nationwide. The Natural Resources Conservation Service SNOTEL network of roughly 800 automated mountain sites, more than 100 of them in Colorado, measures snow water equivalent, the basis of the April 1 runoff forecasts that ditch companies, cities and the state engineer plan around. Gauges also administer water rights, warn of floods and record post-fire sediment pulses.',
      lesson: 'You cannot manage what you do not measure; a gauge is the cheapest water project there is.',
      unlock: function (state) { return funded(state, 'streamgages') || fin(effects(state).sensorCoverage) > 0; },
      linkTo: function (state) {
        var u = fin(climate(state).uncertainty, 0.25);
        return 'Your forecast uncertainty is now ±' + fmt.pct(u * 100) + ' with gauges funded; that narrowing is exactly what SNOTEL and streamgage data do for the real April 1 forecast.';
      }
    },
    {
      id: 'mussels', title: 'Invasive mussel prevention', year: 2022, region: 'Highline Lake and the Colorado River near Grand Junction',
      summary: 'Zebra and quagga mussels, spread mainly on trailered boats, coat intakes, pipes and hydropower works and can cost utilities millions to manage. Colorado Parks and Wildlife has run mandatory boat inspection and decontamination at reservoirs since 2008, performing hundreds of thousands of inspections a year. Colorado kept adult populations out for years, but in 2022 adult zebra mussels were confirmed in Highline Lake near Grand Junction, the state\'s first, and the lake was drained in an attempt to eradicate them. In 2024 zebra mussels were found in the Colorado River itself near Grand Junction and in an irrigation canal.',
      lesson: 'Prevention is a recurring cost, but it is small next to the permanent cost of an established invader.',
      unlock: function (state) { return musselEvent(state); },
      linkTo: function (state) {
        return funded(state, 'mussel_inspection') ? 'Your boat inspection stations are the same program Colorado runs; the upkeep is the price of keeping the intake clear.' : 'A mussel scare has reached your reservoir; without inspection stations, a fouled intake at the treatment plant is the likely outcome.';
      }
    },
    {
      id: 'hayman', title: 'Hayman Fire and Denver Water\'s sediment bill', year: 2002, region: 'South Platte watershed, Upper South Platte',
      summary: 'The Hayman Fire of June 2002 burned about 138,000 acres in the Upper South Platte, then the largest fire in Colorado history, upstream of Denver Water\'s Cheesman and Strontia Springs reservoirs. Together with the 1996 Buffalo Creek Fire, it sent years of sediment into the reservoirs; Denver Water has reported spending on the order of $27 million on dredging Strontia Springs, treatment changes and watershed repair. The experience led to the From Forests to Faucets partnership with the U.S. Forest Service, begun in 2010, in which the utility co-funds forest thinning and restoration because it is cheaper than treating the water afterward.',
      lesson: 'Paying for a healthy forest upstream is a water-treatment cost paid in advance.',
      unlock: function (state) { return contaminationOutage(state); },
      linkTo: function (state) {
        var rv = obj(obj(state).reservoir), st = stats(state);
        return 'Your reservoir is at ' + fmt.num(fin(rv.turbidity) * 100) + '% turbidity and ' + fmt.num(fin(rv.ashContam) * 100) + '% ash with ' + Math.round(fin(st.contaminationOutageDays)) + ' outage days; Denver Water\'s answer was to fund thinning upstream so it would not happen again.';
      }
    },
    {
      id: 'buffalo_creek', title: 'Buffalo Creek: flood after fire', year: 1996, region: 'Jefferson County, Upper South Platte',
      summary: 'In May 1996 the Buffalo Creek Fire burned about 12,000 acres of ponderosa pine southwest of Denver. Two months later, on July 12, a thunderstorm dropped roughly two inches of rain in under an hour on the bare, water-repellent scar. The flash flood tore through the small town of Buffalo Creek, killed two people, destroyed homes and roads, and carried an enormous slug of sediment into Strontia Springs Reservoir, by some estimates more than the reservoir had received in the previous decades combined. It became the textbook Colorado example of why a burn scar is a flood hazard.',
      lesson: 'The most dangerous storm is an ordinary one that falls on a fresh burn scar.',
      unlock: function (state) { return fin(stats(state).sedimentTons) > 0 && fires(state).length >= 1; },
      linkTo: function (state) {
        var st = stats(state);
        return 'Your storm delivered about ' + Math.round(fin(st.sedimentTons)).toLocaleString() + ' t of sediment and ' + fmt.money(fin(st.floodDamageM)) + ' of damage; Buffalo Creek is the same mechanism on a much steeper canyon.';
      }
    },
    {
      id: 'grizzly_creek', title: 'Grizzly Creek Fire and the Glenwood Canyon debris flows', year: 2021, region: 'Glenwood Canyon, Interstate 70',
      summary: 'The Grizzly Creek Fire of August 2020 burned about 32,000 acres of steep canyon walls above Interstate 70 in Glenwood Canyon and closed the highway for roughly two weeks. The following summer, monsoon rains over the burn scar triggered repeated debris flows; in late July 2021 mud and boulders buried sections of I-70, trapping motorists overnight, and the interstate stayed closed for about two weeks while crews cleared and rebuilt. Glenwood Springs temporarily lost use of creek intakes fouled by ash and switched to other supplies. Repairs ran to tens of millions of dollars.',
      lesson: 'Post-fire debris flows follow the drainages, so roads, intakes and towns in the canyon below a scar are all in the path.',
      unlock: function (state) { return fires(state).length >= 1 && fin(stats(state).floodDamageM) > 0.5; },
      linkTo: function (state) {
        var st = stats(state);
        return 'Your post-fire storm caused ' + fmt.money(fin(st.floodDamageM)) + ' of damage; in Glenwood Canyon the same kind of flow shut the state\'s main east-west highway.';
      }
    },
    {
      id: 'flood_2013', title: 'The 2013 Front Range flood', year: 2013, region: 'Boulder, Larimer, Weld and neighboring counties',
      summary: 'From September 9 to 16, 2013, a stalled moist air mass dropped extraordinary rain on the Front Range; Boulder recorded roughly 17 inches in a week, close to its normal annual total. Creeks from the Big Thompson to Boulder Creek left their banks, destroying about 1,800 homes, damaging many thousands more, washing out hundreds of miles of roads and killing at least eight people. Damage was estimated in the billions of dollars, and rebuilding the canyon highways took years. Areas below the 2010 Fourmile Canyon burn scar saw especially heavy sediment.',
      lesson: 'Floods come from the whole watershed at once; warning systems, setbacks and room for the river save more than walls do.',
      unlock: function (state) { return fin(stats(state).floodDamageM) >= 3; },
      linkTo: function (state) {
        var st = stats(state);
        return 'Your flood damage now totals ' + fmt.money(fin(st.floodDamageM)) + '; the 2013 flood is what happens when that scale of runoff hits every drainage on the Front Range in the same week.';
      }
    },
    {
      id: 'beaver_mimicry', title: 'Beaver mimicry and wetland restoration', year: 2020, region: 'Headwater meadows across Colorado',
      summary: 'Across the West, land managers are rebuilding wet meadows with beaver dam analogs, hand-built structures of posts and willow that slow streams the way beaver dams do, and by reintroducing beavers themselves. Ponded water raises the water table, stores runoff into late summer, traps sediment and cools the stream. Research published in 2020 found that beaver-dammed riparian corridors stayed green through wildfires while surrounding areas burned. Colorado projects, from Rocky Mountain National Park meadows scarred by the East Troublesome Fire to ranch creeks on the West Slope, use this low-cost approach to buffer drought, fire and post-fire floods.',
      lesson: 'Slowing water in the headwaters is storage, flood control and habitat in a single cheap project.',
      unlock: function (state) { return wetlandRestored(state); },
      linkTo: function (state) {
        var rv = obj(obj(state).reservoir);
        return 'Your restored wetland below the dam will trap about a third of passing sediment and cut peak flows by roughly 30%; with reservoir storage at ' + fmt.af(fin(rv.storageAF)) + ', that water in the ground is your late-summer cushion.';
      }
    }
  ];

  var BY_ID = {};
  LIST.forEach(function (cs) { BY_ID[cs.id] = cs; });

  // ---------------------------------------------------------------- API
  function safeUnlock(cs, state, world) {
    try { return !!cs.unlock(state, world); } catch (e) { if (WS.DEBUG) console.error('Case unlock error', cs.id, e); return false; }
  }
  function linkTo(id, state) {
    var cs = BY_ID[id];
    if (!cs) return '';
    try { return String(cs.linkTo(obj(state))).replace(/\b(undefined|NaN)\b/g, '?'); } catch (e) { return 'Linked to what you just experienced in your valley.'; }
  }
  function checkUnlocks(state, world) {
    state = obj(state);
    if (!Array.isArray(state.unlockedCases)) state.unlockedCases = [];
    var newly = [];
    LIST.forEach(function (cs) {
      if (state.unlockedCases.indexOf(cs.id) >= 0) return;
      if (safeUnlock(cs, state, world)) { state.unlockedCases.push(cs.id); newly.push(cs.id); }
    });
    return newly;
  }

  WS.CaseStudies = {
    LIST: LIST,
    byId: function (id) { return BY_ID[id] || null; },
    checkUnlocks: checkUnlocks,
    linkTo: linkTo
  };
})();

<script>/* src/render/terrainMesh.js */
/* Watershed — terrain mesh (render). Exports WS.TerrainMesh.
   build(world) -> { mesh, geometry, skirt, heightAt(sx,sz), recolor(world,state,seasonIdx,opts), colorForCell(i,world,state,seasonIdx,out), dispose() }
   Non-indexed BufferGeometry, 2 triangles per cell, flat shaded, per-face vertex colours. */
(function () {
  'use strict';
  var root = (typeof window !== 'undefined') ? window : globalThis;
  var WS = root.WS = root.WS || {};
  var C = WS.C, R = C.RENDER, L = C.LAND, PAL = C.PALETTE;

  /* ---------- palette (sRGB hex -> linear float triplets, once) ---------- */
  function s2l(c) { return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
  function unpack(hex) {
    return new Float32Array([s2l(((hex >> 16) & 255) / 255), s2l(((hex >> 8) & 255) / 255), s2l((hex & 255) / 255)]);
  }
  function mixed(a, b, t) {
    return new Float32Array([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]);
  }
  var P = {};
  Object.keys(PAL).forEach(function (k) { P[k] = unpack(PAL[k]); });
  P.riverBed = mixed(P.waterDeep, P.burnLight, 0.4);
  P.reservoirBed = mixed(P.waterDeep, P.burnLight, 0.6);
  P.earth = unpack(0x4a3b2e);
  P.earthDark = unpack(0x2b221b);
  P.table = unpack(0x3a322c);
  P.roadSnow = mixed(P.road, P.snow, 0.55);

  /* scratch colour registers (module-local; recolor is single-threaded) */
  var cr = 0, cg = 0, cb = 0;
  function setC(p) { cr = p[0]; cg = p[1]; cb = p[2]; }
  function toward(p, t) {
    if (!(t > 0)) return;
    if (t > 1) t = 1;
    cr += (p[0] - cr) * t; cg += (p[1] - cg) * t; cb += (p[2] - cb) * t;
  }
  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

  function snowlineFor(seasonIdx, world, opts) {
    var sl = opts && isFinite(opts.snowlineElev) ? +opts.snowlineElev : NaN;
    if (isFinite(sl)) return sl;
    var base = (world && isFinite(world.snowlineElev)) ? world.snowlineElev : 2600;
    switch (seasonIdx | 0) {
      case C.SEASON.WINTER: return base;
      case C.SEASON.SPRING: return base + 500;
      case C.SEASON.SUMMER: return 3600;
      case C.SEASON.FALL: return 3300;
      default: return base;
    }
  }

  function build(world) {
    if (typeof THREE === 'undefined' || !world || !world.elev) return null;
    var N = world.N || C.N, NN = N * N, CELL = R.CELL, half = N / 2;
    var elev = world.elev, land = world.land;
    var isWater = new Uint8Array(NN);
    for (var i = 0; i < NN; i++) isWater[i] = (land && (land[i] === L.RIVER || land[i] === L.RESERVOIR)) ? 1 : 0;

    /* ---------- corner grid (N+1)^2, scene Y ---------- */
    var NC = N + 1;
    var cornerY = new Float32Array(NC * NC);
    for (var cy = 0; cy <= N; cy++) {
      for (var cx = 0; cx <= N; cx++) {
        var sum = 0, cnt = 0, wsum = 0, wcnt = 0;
        for (var dy = -1; dy <= 0; dy++) {
          var yy = cy + dy; if (yy < 0 || yy >= N) continue;
          for (var dx = -1; dx <= 0; dx++) {
            var xx = cx + dx; if (xx < 0 || xx >= N) continue;
            var ci = yy * N + xx, e = elev[ci];
            if (!isFinite(e)) e = R.ELEV_BASE;
            sum += e; cnt++;
            if (isWater[ci]) { wsum += e; wcnt++; }
          }
        }
        // water-adjacent corners follow the water cells so channels/basins stay carved (crack-free shared grid)
        var m = wcnt > 0 ? wsum / wcnt : (cnt > 0 ? sum / cnt : R.ELEV_BASE);
        cornerY[cy * NC + cx] = C.elevToScene(m);
      }
    }

    /* ---------- geometry: 6 verts per cell ---------- */
    var VERTS = NN * 6;
    var positions = new Float32Array(VERTS * 3);
    var colors = new Float32Array(VERTS * 3);
    var p = 0;
    function v(x, y, z) { positions[p++] = x; positions[p++] = y; positions[p++] = z; }
    for (var y = 0; y < N; y++) {
      var z0 = (y - half) * CELL, z1 = z0 + CELL;
      for (var x = 0; x < N; x++) {
        var x0 = (x - half) * CELL, x1 = x0 + CELL;
        var h00 = cornerY[y * NC + x], h10 = cornerY[y * NC + x + 1];
        var h01 = cornerY[(y + 1) * NC + x], h11 = cornerY[(y + 1) * NC + x + 1];
        // choose the diagonal with the smaller height difference (avoids saddle spikes); CCW from above
        if (Math.abs(h00 - h11) <= Math.abs(h10 - h01)) {
          v(x0, h00, z0); v(x1, h11, z1); v(x1, h10, z0);
          v(x0, h00, z0); v(x0, h01, z1); v(x1, h11, z1);
        } else {
          v(x0, h00, z0); v(x0, h01, z1); v(x1, h10, z0);
          v(x1, h10, z0); v(x0, h01, z1); v(x1, h11, z1);
        }
      }
    }
    var geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    var colorAttr = new THREE.BufferAttribute(colors, 3);
    colorAttr.setUsage(THREE.DynamicDrawUsage);
    geometry.setAttribute('color', colorAttr);
    geometry.computeVertexNormals(); // per-face normals on non-indexed geometry
    geometry.computeBoundingBox();
    geometry.computeBoundingSphere();

    var material = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.95, metalness: 0 });
    var mesh = new THREE.Mesh(geometry, material);
    mesh.name = 'terrain';
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.frustumCulled = false;

    /* ---------- static per-cell shading: elevation banding, aspect, jitter, snow-edge noise ---------- */
    var staticMul = new Float32Array(NN);
    var snowNoise = new Float32Array(NN);
    var jrng = WS.RNG.create(String(world.seed == null ? 0 : world.seed) + ':terrainJitter');
    var snoise = WS.Noise.create(String(world.seed == null ? 0 : world.seed) + ':snowEdge');
    for (i = 0; i < NN; i++) {
      var e2 = isFinite(elev[i]) ? elev[i] : R.ELEV_BASE;
      var t = clamp01((e2 - 1800) / 2000);
      var light = 0.93 + 0.13 * t;                                   // gentle lift with altitude
      var band = 1 + ((((e2 / 120) | 0) & 1) ? 0.022 : -0.022);      // subtle contour banding
      var sl = world.slope ? world.slope[i] : 0, asp = world.aspect ? world.aspect[i] : 0;
      if (!isFinite(sl)) sl = 0; if (!isFinite(asp)) asp = 0;
      var shade = 1 + 0.09 * Math.min(1, sl * 1.6) * (-Math.cos(asp)); // north-facing (aspect 0) darker
      var jit = 1 + (jrng.next() * 2 - 1) * 0.04;
      staticMul[i] = light * band * shade * jit;
      var xx2 = i % N, yy2 = (i / N) | 0;
      snowNoise[i] = snoise.fbm(xx2 * 0.07, yy2 * 0.07, 3) * 90;   // metres of snowline wobble
    }

    /* ---------- colour for one cell ---------- */
    var cachedSeason = -1, cachedSnowline = 2600, activeOpts = null;
    function colorForCell(i, w, state, seasonIdx, out) {
      w = w || world;
      i = i | 0; if (i < 0 || i >= NN) { out[0] = out[1] = out[2] = 0; return out; }
      seasonIdx = seasonIdx | 0;
      if (seasonIdx !== cachedSeason) { cachedSeason = seasonIdx; cachedSnowline = snowlineFor(seasonIdx, w, activeOpts); }
      var ld = w.land ? w.land[i] : L.SHRUB;
      var e = w.elev[i]; if (!isFinite(e)) e = R.ELEV_BASE;
      var moist = w.moisture ? w.moisture[i] : 0.45; if (!isFinite(moist)) moist = 0.45;
      var dry = clamp01(1 - (moist - 0.15) / 0.45);
      var td = w.treeDensity ? w.treeDensity[i] : 0.6; if (!isFinite(td)) td = 0.6;
      var isFall = seasonIdx === C.SEASON.FALL;
      var water = false;

      switch (ld) {
        case L.RIVER: setC(P.riverBed); water = true; break;
        case L.RESERVOIR: setC(P.reservoirBed); water = true; break;
        case L.ALPINE:
          setC(P.alpine);
          toward(P.rock, clamp01((e - ((w.treeline || 3450) + 120)) / 250) * 0.7);
          break;
        case L.FOREST:
          setC(P.forest);
          toward(P.forestDark, td * 0.5);
          toward(P.shrubGreen, (1 - td) * 0.35);
          toward(P.forestDry, 0.35 * dry);
          break;
        case L.SHRUB:
          setC(P.shrubGreen);
          toward(P.shrub, Math.min(1, dry * 2));
          toward(P.shrubDry, Math.max(0, dry * 2 - 1));
          if (isFall) toward(P.shrubDry, 0.25);
          break;
        case L.FARM: {
          var h = w.cropHealth ? w.cropHealth[i] : 0.85; if (!isFinite(h)) h = 0.85;
          setC(P.farm);
          toward(P.farmDry, 1 - h);
          toward(P.farmFallow, dry * 0.35);
          if (isFall) toward(P.farmDry, 0.3);
          break;
        }
        case L.RESIDENTIAL: setC(P.residential); break;
        case L.CIVIC: setC(P.civic); break;
        case L.WETLAND: setC(P.wetland); toward(P.shrub, dry * 0.3); break;
        case L.ROAD: setC(P.roadShoulder || P.road); break; // the props road ribbon draws the asphalt; the cell reads as gravel shoulder/yard
        case L.RIPARIAN:
          setC(P.riparian);
          toward(P.shrubDry, dry * 0.4);
          if (isFall) toward(P.aspenFall, 0.55);
          break;
        default: setC(P.shrub); break;
      }

      // burn: blend to burnLight->burnSevere with an ash tint
      var b = w.burn ? w.burn[i] : 0;
      if (b > 0 && !water) {
        if (b > 1) b = 1;
        var wb = Math.min(1, b * 1.4);
        var bl = P.burnLight, bs = P.burnSevere, ash = P.ash;
        var br = bl[0] + (bs[0] - bl[0]) * b, bg = bl[1] + (bs[1] - bl[1]) * b, bb = bl[2] + (bs[2] - bl[2]) * b;
        var at = 0.25 * b;
        br += (ash[0] - br) * at; bg += (ash[1] - bg) * at; bb += (ash[2] - bb) * at;
        cr += (br - cr) * wb; cg += (bg - cg) * wb; cb += (bb - cb) * wb;
      }

      // snow above the seasonal snowline with a soft noisy edge (not on water; partial on roads)
      if (!water) {
        var sl2 = cachedSnowline;
        var s = C.smoothstep(sl2 - 70, sl2 + 70, e + snowNoise[i]);
        if (s > 0) {
          var slope = w.slope ? w.slope[i] : 0; if (!isFinite(slope)) slope = 0;
          s *= 1 - 0.45 * Math.min(1, slope);
          if (ld === L.ROAD) toward(P.roadSnow, s); else toward(P.snow, s);
        }
      }

      var m = staticMul[i];
      out[0] = clamp01(cr * m); out[1] = clamp01(cg * m); out[2] = clamp01(cb * m);
      return out;
    }

    var scratch = new Float32Array(3);
    function recolor(w, state, seasonIdx, opts) {
      w = w || world;
      activeOpts = opts || null;
      cachedSeason = -1; // force snowline recompute with new opts
      var col = colors;
      for (var ci = 0, j = 0; ci < NN; ci++, j += 18) {
        colorForCell(ci, w, state, seasonIdx, scratch);
        var r0 = scratch[0], g0 = scratch[1], b0 = scratch[2];
        col[j] = r0; col[j + 1] = g0; col[j + 2] = b0;
        col[j + 3] = r0; col[j + 4] = g0; col[j + 5] = b0;
        col[j + 6] = r0; col[j + 7] = g0; col[j + 8] = b0;
        col[j + 9] = r0; col[j + 10] = g0; col[j + 11] = b0;
        col[j + 12] = r0; col[j + 13] = g0; col[j + 14] = b0;
        col[j + 15] = r0; col[j + 16] = g0; col[j + 17] = b0;
      }
      colorAttr.needsUpdate = true;
    }

      setFireIntensity: function (level) { fireLevel = clamp(fin(level, 0), 0, 1); },

      setFire: function (burningIdx) {

  }

  /* ------------------------------------------------------------------ adapters */
  // Renderer adapter: every method is a guarded call into WS.Renderer (or a no-op when headless / missing).
  var RENDER_FNS = ['init', 'setSeason', 'refreshWorld', 'setReservoir', 'setRiverFlow', 'setFire', 'setWeather', 'setWind', 'showDebris', 'clearDebris',
    'setOverlay', 'setHighlight', 'addMarker', 'removeMarker', 'clearMarkers', 'setPlacementCursor', 'flyTo', 'flyToZone', 'setTimeOfDay', 'onCellClick', 'onCellHover', 'getStats', 'dispose',

    'setTacticalMode', 'onCellPaint', 'setFlooded', 'playRetardantDrop', 'setFireIntensity', 'pulseZone'];
  function makeRenderer(real) {
    var r = { real: !!real };
    RENDER_FNS.forEach(function (fn) {
      r[fn] = real ? function () { return call.apply(null, ['Renderer', fn].concat(Array.prototype.slice.call(arguments))); } : function () { };
    });
    return r;
  }
  // UI adapter: every method returns a Promise. Headless: `decide` callbacks answer cards; everything else is a no-op.
  var UI_FNS = ['init', 'refresh', 'setPhase', 'showIntro', 'showEventCard', 'showEvidenceBoard', 'showSeasonReport', 'showCaseStudy', 'showEnd', 'showHelp', 'toast', 'ticker',
    'showFireBanner', 'startPlacement', 'updatePlacement', 'endPlacement', 'renderProjects', 'renderWater', 'renderFire', 'renderConditions', 'renderLog', 'setBusy', 'flashOutcome', 'tutorialStep', 'closeModal',
    // SPEC2 §D tactical HUD / after-action (guarded: missing fns resolve immediately, so crisis loops never stall)
    'showTactical', 'updateTactical', 'hideTactical', 'alert', 'showAfterAction'];
  function makeUI(real, decide) {
    var u = { real: !!real, decide: decide || {} };
    UI_FNS.forEach(function (fn) {
      u[fn] = real
        ? function () { try { return Promise.resolve(call.apply(null, ['UI', fn].concat(Array.prototype.slice.call(arguments)))); } catch (e) { return Promise.resolve(); } }
        : function () { return Promise.resolve(); };
    });
    if (!real) {
      u.showEventCard = function (card) {
        var idx = 0;
        try { if (typeof u.decide.card === 'function') idx = u.decide.card(card); } catch (e) { idx = 0; }

  }

  /* ------------------------------------------------------------------ game factory */
  /** createGame(opts) → game. opts: { seed, years, mode, tutorial, ui, renderer, decide, headless, save } */
  function createGame(opts) {
    opts = opts || {};
    var headless = !!opts.headless;
    var ui = opts.ui || makeUI(!headless, opts.decide);
    var renderer = opts.renderer || makeRenderer(!headless);
    var decide = opts.decide || {};
    var game = { formatters: C.fmt, headless: headless, ui: ui, renderer: renderer };
    var state = null, world = null, rng = null, speed = 1, ended = false, begun = false, running = false;
    var placement = null;      // active flood-prep placement session
    var crisis = null;         // active real-time crisis (SPEC2 §E): { mode:'fire'|'storm', paused, selected, ... }
    var paintUnsub = null, clickUnsub = null;   // renderer subscriptions (made once per renderer init, released on dispose/restart)
    var turnNotes = null;      // per-turn scratch used by the timeline builder
    var stats = { fires: 0, floods: 0, storms: 0, burns: 0, cards: 0, turns: 0 };
    var overlayModes = ['none', 'watershed', 'fire', 'moisture', 'burn'];
    var overlayMode = 'none';
    var evidenceShown = {};    // "topic:year" → true (auto-open once per season/year)
    var tutorialDone = false;

    // Skips waiting when the page is hidden (browsers throttle timers to ~1/s in background tabs, which would stall the season).
    function sleep(ms) { if (headless || (typeof document !== 'undefined' && document.hidden)) return Promise.resolve(); return new Promise(function (res) { setTimeout(res, Math.max(0, ms)); }); }
    function log(text, kind) {

      else { state.log = state.log || []; state.log.push({ turn: state.turn, text: text, kind: kind || 'info' }); }
    }
    function toast(text, kind) { if (text) ui.toast(text, kind || 'info'); }
    function effects() { return call('Projects', 'effects', state) || {}; }
    function fail(where, e) {

      toast('Something went wrong: ' + (e && e.message ? e.message : e), 'bad');
    }
    function setPhase(phase, info) { if (state) state.phase = phase; ui.setPhase(phase, info || {}); }
    function refresh() { ui.refresh(); }
    function capacity() {
      var cap = num(state && state.reservoir && state.reservoir.capacityAF, C.HYDRO.RESERVOIR_CAPACITY_AF);
      return cap * (1 + num(effects().reservoirCapacityBonus, 0));
    }
    function storageFrac() { return clamp(num(state.reservoir.storageAF) / Math.max(1, capacity()), 0, 1.2); }
    function pushReservoirVisual() {

      renderer.setRiverFlow(num(state.climate.streamflowCfs, 40), num(state.reservoir.turbidity));
    }
    function weatherFromClimate(cl) {
      cl = cl || state.climate || {};
      var s = state.season;

      if (s === SEASON.WINTER && num(cl.precipIn) > 0.4) return ['snow', clamp(num(cl.precipIn) / 4, 0.2, 1)];
      if (num(cl.fireDanger) > 0.7) return ['haze', clamp((num(cl.fireDanger) - 0.7) / 0.3 * 0.6 + 0.3, 0.3, 0.9)];

    /* ---------------------------------------------------- world / state construction */

    game.serialize = function () {

    };
    game.deserialize = function (str) {
      var blob = JSON.parse(str);
      var st = has('State', 'deserialize') ? call('State', 'deserialize', blob.state) : JSON.parse(blob.state);

    };

    /* ---------------------------------------------------- evidence board / tutorial */
    async function openEvidence(topic, opts) {
      if (headless) return;
      var recs = call('Advisors', 'getRecommendations', state, world, topic) || [];
      opts = opts || {};
      opts.title = opts.title || ({ budget: 'Evidence Board — Winter budget', allocation: 'Evidence Board — Spring water allocation', prescribed_burn: 'Evidence Board — Prescribed burn', flood: 'Evidence Board — Storm over the burn scar', fire_policy: 'Evidence Board — Fire policy', contamination: 'Evidence Board — Water quality', drought: 'Evidence Board — Drought' }[topic] || 'Evidence Board');
