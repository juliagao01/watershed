<script>
(function () {
  'use strict';
  var C = WS.C, N = C.N, NN = N * N;
  var rng = WS.RNG.create(7);
  var out = document.getElementById('devout');
  function say(t) { out.textContent = t; console.log('[dev]', t); }

  /* ---- mock world ---- */
  var forestNames = ['Cameron Ridge', 'Troublesome Bench', 'North Fork Slopes', 'Kestrel Divide', 'Ponderosa Flats', 'Roaring Gulch'];
  var hoodNames = ['Marshall Heights', 'Old Mill', 'Riverbend', 'Sagebrush Estates'];
  var farmNames = ['Lazy J Ranch', 'Two Rivers Farm', 'Hay Meadows Co-op', 'Orchard Bench'];
  var world = { seed: 7, N: N, fuel: new Float32Array(NN), burn: new Float32Array(NN), zones: [] };
  var zid = 0;
  function mkZone(type, name, n, extra) {
    var cells = new Int32Array(n); for (var i = 0; i < n; i++) cells[i] = rng.int(0, NN - 1);
    var z = Object.assign({ id: zid++, type: type, name: name, cells: cells, center: { x: rng.int(10, 118), y: rng.int(10, 118) }, upstreamOfReservoir: false }, extra || {});
    world.zones.push(z); return z;
  }
  forestNames.forEach(function (n, i) { var z = mkZone('forest', n, 1000, { upstreamOfReservoir: i < 4 }); var f = 0.45 + i * 0.07; for (var k = 0; k < z.cells.length; k++) { world.fuel[z.cells[k]] = f + rng.next() * 0.1; if (i === 1) world.burn[z.cells[k]] = rng.next() < 0.35 ? 0.7 : 0; } });
  hoodNames.forEach(function (n) { mkZone('neighborhood', n, 90); });
  farmNames.forEach(function (n) { mkZone('farm', n, 300); });
  mkZone('wetland', 'Bitterbrush Wetland', 60);
  world.zoneById = function (id) { return world.zones.filter(function (z) { return z.id === id; })[0] || null; };
  world.zonesOf = function (t) { return world.zones.filter(function (z) { return z.type === t; }); };

  /* ---- mock state (SPEC §3) with 8 history entries ---- */
  var history = [];
  for (var t = 0; t < 8; t++) {
    history.push({ turn: t, year: 1 + Math.floor(t / 4), season: t % 4, storageAF: 32000 - t * 1800 + (t % 4 === 1 ? 6000 : 0), snowpackPct: [102, 88, 71, 64, 96, 80, 58, 75][t], streamflowCfs: [40, 210, 55, 30, 45, 190, 38, 26][t], fireDanger: [0.15, 0.3, 0.62, 0.45, 0.2, 0.35, 0.78, 0.5][t], fuelAvg: 0.6 + t * 0.01, turbidity: [0.05, 0.05, 0.08, 0.3, 0.2, 0.14, 0.1, 0.42][t], W: 70 - t, E: 65 - t * 1.5, P: 72 - t * 0.5, F: 68 - t * 2, T: 60 + (t % 3), R: 67 - t, budget: 12 - (t % 4) * 3, cropHealth: 0.85 - t * 0.02, shortagePct: t * 0.01, trust: 60, precipIn: [2.1, 3.4, 1.2, 2.8, 2.5, 3.9, 0.6, 3.1][t], tempAnomF: [-1, 0.5, 3.2, 1.1, 0.2, 1.4, 4.1, 2.0][t], soilMoisturePct: [48, 55, 34, 40, 46, 52, 28, 38][t], population: 12400 + t * 40 });
  }
  var state = {
    seed: 7, mode: 'simulated', years: 6, turn: 8, year: 3, season: 0, phase: 'plan',
    budget: 9.4, annualBudget: 12, emergencyFund: 2.5,
    outcomes: { W: 62, E: 55, P: 70, F: 52, T: 61 }, resilience: 60.1,
    population: 12720, growthRate: 0.012,
    climate: { snowpackPct: 75, snowSWEin: 13.5, precipIn: 2.4, tempAnomF: 1.8, soilMoisturePct: 38, fireDanger: 0.52, fireDangerLabel: 'High', streamflowCfs: 31, windDirRad: 0.8, windMph: 12, drought: 'D2', description: 'A thin, early-melting snowpack after a warm winter. Fuels are drying out early.', uncertainty: 0.25 },
    reservoir: { storageAF: 21500, capacityAF: 42000, turbidity: 0.42, ashContam: 0.3, algae: 0.1 },
    water: { demands: { households: 1650, farms: 0, fire: 600, hydro: 2200, recreation: 1500, tribal: 375, wildlife: 2500, downstream: 2250 },
             alloc: { households: 1, farms: 1, fire: 1, hydro: 0.8, recreation: 0.6, tribal: 1, wildlife: 1, downstream: 1 },
             delivered: { households: 1600, farms: 0, fire: 600, hydro: 1500, recreation: 900, tribal: 375, wildlife: 2300, downstream: 2250 }, shortage: {}, availableAF: 9800, inflowAF: 2100, outflowAF: 9525, restriction: 'voluntary' },
    fire: { policy: 'managed', activeFire: null, seasonAcres: 0, totalAcres: 4120, structuresLost: 3, fires: [{ year: 2, season: 2, acres: 4120, zoneIds: [1, 2], structures: 3, upstream: true }], smokeDays: 6 },
    projects: { funded: { streamgages: { level: 0, targets: [], turnFunded: -1 }, forest_thinning: { level: 1, targets: [0], turnFunded: 3 } }, pendingBurn: null },
    mitigations: [], pendingStorm: { intensityIn: 2.1, turnsUntil: 1, source: 'event' }, scheduled: [],
    log: [
      { turn: 2, year: 1, season: 2, text: 'Funded forest thinning in Cameron Ridge ($1.8M).', kind: 'good' },
      { turn: 5, year: 2, season: 1, text: 'Low snowpack: 64% of average. Farms warned of a short summer.', kind: 'warn' },
      { turn: 6, year: 2, season: 2, text: 'Lightning fire in Troublesome Bench — 4,120 acres, 3 homes lost.', kind: 'bad' },
      { turn: 7, year: 2, season: 3, text: 'Storm forecast over the burn scar. Emergency fund released.', kind: 'event' },
      { turn: 8, year: 3, season: 0, text: 'New year: budget +$12.0M, upkeep −$0.4M.', kind: 'info' }
    ],
    timeline: [{ turn: 6, year: 2, season: 2, entries: [{ text: 'A century of suppression left Troublesome Bench at 78% fuel load; the lightning strike found dry, dense fuel and ran 4,120 acres in three days.', kind: 'fire' }, { text: 'Your thinning in Cameron Ridge slowed the western flank; the fire stopped at the treated boundary.', kind: 'good' }] }],
    history: history, unlockedCases: ['cameron_peak', 'streamgages'], seenCases: ['streamgages'],
    flags: {}, stats: { floodDamageM: 0, sedimentTons: 0, contaminationOutageDays: 0, cropLossPct: 0.04, hydroMWh: 1800, recreationVisits: 42000 }, lastSeasonReport: null
  };

  /* ---- mock sim modules used by the UI (spec'd APIs only) ---- */
  WS.Advisors = { CHARACTERS: [
    { id: 'reyes', name: 'Capt. Dolores Reyes', role: 'Wildland fire captain', color: '#ff7a33', avatarEmoji: '🚒' },
    { id: 'jensen', name: 'Walt Jensen', role: 'Rancher, Lazy J', color: '#d4a24c', avatarEmoji: '🤠' },
    { id: 'whitehorse', name: 'Naomi Whitehorse', role: 'Tribal water representative', color: '#e9c46a', avatarEmoji: '🪶' },
    { id: 'natarajan', name: 'Dr. Priya Natarajan', role: 'Hydrologist', color: '#4aa3df', avatarEmoji: '🔬' },
    { id: 'lee', name: 'Marcus Lee', role: 'Resident, Marshall Heights', color: '#8f8b82', avatarEmoji: '🏡' },
    { id: 'ortiz', name: 'Dr. Ana Ortiz', role: 'Wildlife biologist', color: '#6fbf73', avatarEmoji: '🦌' }
  ] };
  WS.CaseStudies = { LIST: [
    { id: 'cameron_peak', title: 'Cameron Peak Fire', year: 2020, region: 'Larimer County', summary: 'Colorado\'s largest wildfire at roughly 208,000 acres burned much of the Cache la Poudre watershed above Fort Collins\' water supply. Summer storms in 2021 sent ash and debris into the river; utilities switched sources and spent years on sediment.', lesson: 'Protecting a water supply means managing the forest above it, years before the fire.', linkTo: 'Your fire in Troublesome Bench burned upstream of the reservoir, just as Cameron Peak burned above the Poudre intakes.' },
    { id: 'east_troublesome', title: 'East Troublesome Fire', year: 2020, region: 'Grand County', summary: 'Ran about 17 miles in a single day into Grand Lake and Rocky Mountain National Park, ~193,000 acres.', lesson: 'Wind-driven fires outrun suppression; fuel treatment and evacuation planning matter more than crews on the day.' },
    { id: 'marshall', title: 'Marshall Fire', year: 2021, region: 'Boulder County', summary: 'A December grass fire driven by 100+ mph winds destroyed more than 1,000 homes in Louisville and Superior.', lesson: 'The wildland-urban interface includes grassland suburbs, not just mountain forests.' },
    { id: 'streamgages', title: 'Streamgages', year: 1889, region: 'Statewide', summary: 'The USGS and Colorado DWR gauge network provides near-real-time flow data that water managers and flood warnings depend on.', lesson: 'You cannot manage what you do not measure.' },
    { id: 'shoshone', title: 'Shoshone Water Right', year: 1902, region: 'Glenwood Canyon', summary: 'A senior non-consumptive hydro right that keeps water flowing in the Colorado River; a 2024 purchase agreement by the Colorado River District aims to preserve it.', lesson: 'Non-consumptive rights can protect a river for everyone downstream.' }
  ] };
  WS.Flood = { TOOLS: {
    mulch: { name: 'Straw mulch', desc: 'Covers bare burned soil so rain soaks in instead of running off; cuts sediment ~60% within its radius.', costM: 0.35, radius: 1 },
    barrier: { name: 'Log barrier', desc: 'Straw wattles or felled logs on contour slow runoff and trap up to 300 t of sediment each.', costM: 0.15 },
    debris_basin: { name: 'Debris basin', desc: 'Excavated basin on a channel below the scar; traps up to 4,000 t before the reservoir.', costM: 1.2, capacityTons: 4000 },
    bank_stab: { name: 'Bank stabilisation', desc: 'Rock and willow along the river below the dam prevents bank erosion adding to the sediment load.', costM: 0.5 },
    intake_protect: { name: 'Intake boom', desc: 'Curtain around the treatment intake; reduces ash reaching the plant.', costM: 0.8, max: 1 },
    sensor: { name: 'Turbidity sensor', desc: 'A sensor upstream of the intake gives hours of warning — halving a contamination outage.', costM: 0.2 },
    warning: { name: 'Flood warning', desc: 'Sirens and alerts in a neighbourhood cut injury risk 80%.', costM: 0.25 }
  } };
  WS.Projects = { effects: function () { return { thinnedZones: { 0: 0.76 }, fuelBreakZones: { 4: true }, hardenedZones: {} }; } };

  /* ---- mock game facade (SPEC §11) ---- */
  var game = {
    state: state, world: world, formatters: C.fmt,
    fundProject: function (id, target) { say('fundProject(' + id + ', ' + target + ')'); state.budget -= 1; return { ok: true, text: 'Funded ' + id }; },
    setAllocation: function (s, f) { if (s === 'power_rec') { state.water.alloc.hydro = f; state.water.alloc.recreation = f; } else state.water.alloc[s] = f; say('setAllocation(' + s + ', ' + f.toFixed(2) + ')'); },
    getCoreProjects: function () { return ['streamgages', 'forest_thinning', 'prescribed_burn', 'home_hardening', 'wetland', 'irrigation', 'treatment', 'warning_system']; },
    /* v2 tactical facade (mock): mutates the mock spec and pushes an update */
    selectTactic: function (t) { say('selectTactic(' + t + ')'); if (tac.spec) { tac.spec.tools.forEach(function (x) { x.selected = !!t && x.type === t; }); WS.UI.updateTactical(tac.spec); } },
    setPaused: function (b) { say('setPaused(' + b + ')'); if (tac.spec) { tac.spec.paused = !!b; WS.UI.updateTactical(tac.spec); } },
    applyTacticToZone: function (t, z) { say('applyTacticToZone(' + t + ', ' + z + ')'); var name = (world.zoneById(z) || {}).name || ('zone ' + z); if (tac.spec) { var tool = tac.spec.tools.filter(function (x) { return x.type === t; })[0]; if (tool && tool.remaining != null) tool.remaining = Math.max(0, tool.remaining - 1); tac.spec.points.value = Math.max(0, tac.spec.points.value - (t === 'engine' ? 6 : 0)); WS.UI.updateTactical(tac.spec); } WS.UI.alert((t === 'evacuate' ? 'Evacuation ordered: ' : 'Engine crew stationed in ') + name, t === 'evacuate' ? 'warn' : 'good'); return { ok: true, text: (t === 'evacuate' ? 'Evacuated ' : 'Engine sent to ') + name }; },
    applyTactic: function (t) { say('applyTactic(' + t + ')'); if (t === 'mutual_aid' && tac.spec) { var tool = tac.spec.tools.filter(function (x) { return x.type === t; })[0]; if (tool && tool.remaining === 0) return { ok: false, reason: 'Mutual aid already called' }; if (tool) tool.remaining = 0; tac.spec.points.value = Math.min(tac.spec.points.max, tac.spec.points.value + 10); WS.UI.updateTactical(tac.spec); WS.UI.alert('Mutual aid arriving: +10 crew points', 'good'); return { ok: true, text: 'Neighboring counties send crews (+10 pts, −$1.5M)' }; } if (t === 'spillway' && tac.spec) { var sp = tac.spec.tools.filter(function (x) { return x.type === t; })[0]; if (sp) { sp.remaining = 0; sp.disabled = true; sp.reason = 'Gates already open'; } WS.UI.updateTactical(tac.spec); WS.UI.alert('Emergency release: gates open', 'flood'); return { ok: true, text: 'Dam gates opened — 1,500 AF released' }; } return { ok: true }; },
    setRestriction: function (l) { state.water.restriction = l; say('setRestriction(' + l + ')'); },
    setFirePolicy: function (p) { state.fire.policy = p; say('setFirePolicy(' + p + ')'); },
    scheduleBurn: function (z) { state.projects.pendingBurn = { zoneId: z }; say('scheduleBurn(' + z + ')'); return { ok: true }; },
    cancelBurn: function () { state.projects.pendingBurn = null; say('cancelBurn()'); },
    endSeason: function () { say('endSeason()'); WS.UI.setPhase('live', { ticker: 'Season running…' }); WS.UI.setBusy(true); setTimeout(function () { WS.UI.setBusy(false); state.season = (state.season + 1) % 4; WS.UI.setPhase('plan'); WS.UI.refresh(); }, 1500); },
    setSpeed: function (n) { say('setSpeed(' + n + ')'); }, setOverlay: function (m) { say('setOverlay(' + m + ')'); },
    highlightZone: function (z) { say('highlightZone(' + z + ')'); }, focusZone: function (z) { say('focusZone(' + z + ')'); }, focusCell: function () {},
    selectPlacementTool: function (t) { say('selectPlacementTool(' + t + ')'); }, finishPlacement: function () { say('finishPlacement()'); WS.UI.setPhase('plan'); },
    openEvidence: function (topic) { say('openEvidence(' + topic + ')'); WS.UI.showEvidenceBoard(topic, game.getAdvisors(topic), { title: null }); },
    openCaseStudy: function (id) { say('openCaseStudy(' + id + ')'); WS.UI.showCaseStudy(WS.CaseStudies.LIST.filter(function (c) { return c.id === id; })[0] || { id: id }); },
    save: function () { say('save()'); return true; }, load: function () { say('load()'); return false; }, restart: function () { say('restart()'); },
    getProjectList: function () {
      var forest = world.zonesOf('forest'), hoods = world.zonesOf('neighborhood');
      return [
        { def: { id: 'streamgages', name: 'Streamgages', icon: '📡', category: 'monitor', costM: 1.5, upkeepM: 0.1, maxLevel: 1, targetType: 'global', summary: 'Real-time flow and snow telemetry.', detail: 'Colorado\'s DWR and USGS gauges give managers hourly flow data. Without them your readings carry ±25% uncertainty.', tradeoff: 'Money spent on data is money not spent on pipes.', seasonsAllowed: [0, 1, 2, 3] }, funded: false, level: 0, canFund: true, reason: '', targets: [] },
        { def: { id: 'forest_thinning', name: 'Forest thinning', icon: '🪓', category: 'fire', costM: 1.8, upkeepM: 0, maxLevel: 6, targetType: 'forest', summary: 'Mechanically thin a sector to cut fuel ~45%.', detail: 'Thinning restores the open ponderosa structure that carried frequent low-intensity fire before 1900. Effect decays ~12%/yr as the stand regrows.', tradeoff: 'Costly per acre and needs a market for small-diameter wood.', seasonsAllowed: [0, 1, 2, 3] }, funded: true, level: 1, canFund: true, reason: '', targets: forest.map(function (z, i) { return { zoneId: z.id, name: z.name, funded: i === 0 }; }) },
        { def: { id: 'prescribed_burn', name: 'Prescribed burn', icon: '🔥', category: 'fire', costM: 0.6, upkeepM: 0, maxLevel: 6, targetType: 'forest', summary: 'Burn a sector under controlled conditions.', detail: 'Reduces fuel ~60% for a fraction of thinning\'s cost. Windows are narrow: Spring and Fall only.', tradeoff: 'Smoke, and a small chance of escape.', seasonsAllowed: [1, 3] }, funded: false, level: 0, canFund: false, reason: 'Only in Spring/Fall', targets: forest.map(function (z) { return { zoneId: z.id, name: z.name, funded: false }; }) },
        { def: { id: 'home_hardening', name: 'Home hardening', icon: '🏠', category: 'community', costM: 2.2, upkeepM: 0, maxLevel: 4, targetType: 'neighborhood', summary: 'Ember-resistant vents, roofs and defensible space.', detail: 'Most homes ignite from embers, not flame fronts. Hardening cuts the loss rate from ~55% to ~15% in a burning neighbourhood.', tradeoff: 'Slow to roll out; needs homeowner buy-in.', seasonsAllowed: [0, 1, 2, 3] }, funded: false, level: 0, canFund: true, reason: '', targets: hoods.map(function (z) { return { zoneId: z.id, name: z.name, funded: false }; }) },
        { def: { id: 'reservoir_upgrade', name: 'Reservoir upgrade', icon: '🏗', category: 'water', costM: 6.5, upkeepM: 0.2, maxLevel: 2, targetType: 'global', summary: '+15% capacity, then a multi-level intake.', detail: 'A multi-level intake lets the plant draw from the cleanest layer when ash and algae stratify the pool.', tradeoff: 'Expensive; capacity is worthless in a dry year with nothing to store.', seasonsAllowed: [0, 1, 2, 3] }, funded: false, level: 0, canFund: true, reason: '', targets: [] },
        { def: { id: 'wetland', name: 'Wetland restoration', icon: '🌿', category: 'flood', costM: 1.4, upkeepM: 0, maxLevel: 1, targetType: 'wetland', summary: 'Restore the floodplain wetland below the dam.', detail: 'Wetlands trap ~35% of sediment and shave ~30% off peak flows passing through them, while rebuilding elk and bird habitat.', tradeoff: 'Takes farmland out of production.', seasonsAllowed: [0, 1, 2, 3] }, funded: false, level: 0, canFund: false, reason: 'Needs $1.4M; budget short after upkeep', targets: [{ zoneId: 14, name: 'Bitterbrush Wetland', funded: false }] },
        { def: { id: 'irrigation', name: 'Irrigation efficiency', icon: '💧', category: 'water', costM: 2.0, upkeepM: 0, maxLevel: 3, targetType: 'global', summary: 'Pipe ditches and add drip: farms need ~20% less water per level.', detail: 'Lining or piping open ditches and moving to sprinklers/drip cuts seepage and evaporation losses.', tradeoff: 'Return flows that fed the river and neighbours shrink.', seasonsAllowed: [0, 1, 2, 3] }, funded: false, level: 0, canFund: true, reason: '', targets: [] },
        { def: { id: 'treatment', name: 'Treatment upgrade', icon: '🏭', category: 'water', costM: 3.5, upkeepM: 0.15, maxLevel: 2, targetType: 'global', summary: 'Handle ash and turbidity without shutting the plant.', detail: 'Pre-sedimentation and activated carbon let the plant keep running through a post-fire slug.', tradeoff: 'Expensive standing capacity you hope never to need.', seasonsAllowed: [0, 1, 2, 3] }, funded: false, level: 0, canFund: true, reason: '', targets: [] },
        { def: { id: 'warning_system', name: 'Flood warning system', icon: '🚨', category: 'community', costM: 0.9, upkeepM: 0.05, maxLevel: 1, targetType: 'global', summary: 'Sirens, rain gauges and reverse-911 for every neighborhood.', detail: 'Flash floods off burn scars arrive in minutes; warning time is what keeps people out of the water.', tradeoff: 'Does nothing for property.', seasonsAllowed: [0, 1, 2, 3] }, funded: false, level: 0, canFund: true, reason: '', targets: [] },
        { def: { id: 'shelters', name: 'Smoke shelters', icon: '🏥', category: 'community', costM: 0.7, upkeepM: 0, maxLevel: 1, targetType: 'global', summary: 'Clean-air rooms at the school and clinic.', detail: 'Cuts the health impact of smoke days for vulnerable residents.', seasonsAllowed: [0, 1, 2, 3] }, funded: false, level: 0, canFund: true, reason: '', targets: [] },
        { def: { id: 'outreach', name: 'Community outreach', icon: '🤝', category: 'community', costM: 0.3, upkeepM: 0, maxLevel: 3, targetType: 'global', summary: 'Meetings, drought education, rebates.', detail: 'Raises trust and makes restrictions land more softly.', seasonsAllowed: [0, 1, 2, 3] }, funded: false, level: 0, canFund: true, reason: '', targets: [] }
      ];
    },
    getAdvisors: function (topic) {
      var stor = history.map(function (x) { return x.storageAF; });
      return [
        { characterId: 'reyes', stance: 'urge', headline: 'Fuel in Kestrel Divide is at 80% — treat it now.', text: 'Fire danger is High with a D2 drought and fuels drying early. Untreated sectors above the reservoir are the ones that will hurt us twice.', evidence: { label: 'Fire danger', unit: 'index', series: history.map(function (x) { return x.fireDanger; }), current: 0.52, threshold: 0.6 } },
        { characterId: 'jensen', stance: 'oppose', headline: 'Farms cannot take another short year.', text: 'Crop health is down to 71% and you are talking about spending on trees. Deliver the water first.', evidence: { label: 'Crop health', unit: '%', series: history.map(function (x) { return Math.round(x.cropHealth * 100); }), current: 71, threshold: 75 } },
        { characterId: 'whitehorse', stance: 'caution', headline: 'The senior right is not negotiable.', text: 'Our right predates every ditch in this valley. Plan around it rather than hoping the reservoir bails you out.', evidence: { label: 'Storage', unit: 'AF', series: stor, current: 21500, threshold: 4000 } },
        { characterId: 'natarajan', stance: 'support', headline: 'Streamgages would cut uncertainty from ±25% to ±5%.', text: 'Every allocation you make is built on estimates. A $1.5M gauge network is the cheapest risk reduction on the board.', evidence: { label: 'Streamflow', unit: 'cfs', series: history.map(function (x) { return x.streamflowCfs; }), current: 31, threshold: 14 } },
        { characterId: 'ortiz', stance: 'caution', headline: 'Turbidity is climbing toward 0.5.', text: 'Fish kills follow when ash and sediment stay suspended through a low-flow summer. Keep the minimum flow and restore the wetland.', evidence: { label: 'Turbidity', unit: 'index', series: history.map(function (x) { return x.turbidity; }), current: 0.42, threshold: 0.5 } }
      ];
    },
    listZones: function (type) { return world.zonesOf(type); }
  };
  var tac = { spec: null, timer: null };
  window.game = game;
  WS.UI.init(game);
  WS.UI.setPhase('plan');

  /* ---- dev buttons ---- */
  var bar = document.getElementById('devbar');
  function btn(label, fn) { var b = document.createElement('button'); b.textContent = label; b.onclick = fn; bar.appendChild(b); }
  btn('Intro', function () { WS.UI.showIntro().then(function (r) { say('intro → ' + JSON.stringify(r)); }); });
  btn('Event', function () {
    WS.UI.showEventCard({ id: 'storm_forecast', title: 'Storm forecast over the burn scar', icon: '⛈', severity: 'crisis', text: 'The National Weather Service is calling for 2.1 inches in an hour over Troublesome Bench, where 4,120 acres burned last summer. Burned soils shed water like pavement; the creek below could run twenty times its normal flow.', source: 'After the 2020 fires, 2021 monsoon storms sent debris flows down Poudre Canyon and closed I-70 in Glenwood Canyon.',
      choices: [{ label: 'Release the emergency fund and prepare', desc: 'Open the flood-prep toolbar with $2.5M for mulch, barriers and basins.', costM: 0 }, { label: 'Pre-emptively lower the reservoir', desc: 'Make room for sediment-laden inflow; lose 3,000 AF of stored water.', costM: 0.3, delta: { W: -3, P: 2 } }, { label: 'Hire a private crew for the intake', desc: 'Contractors boom the intake and stage pumps.', costM: 12 }] }).then(function (i) { say('event choice → ' + i); });
  });
  btn('Evidence', function () { game.openEvidence('budget'); });

  /* ---- v2: tactical HUD mocks ---- */
  function fireSpec() {
    return { mode: 'fire', title: 'WILDFIRE — 1,240 acres', subtitle: 'Kestrel Divide · lightning start · wind 14 mph from the SW', step: 6, maxSteps: 60, paused: false, speed: 1,
      points: { label: 'Crew points', value: 14.2, max: 30, unit: 'pts' },
      tools: [
        { type: 'dozer', name: 'Dozer / hand line', icon: '🚜', desc: 'Scrape a fuel break. Cells become a firebreak after 2 steps; fire almost never crosses a finished line.', cost: '1 pt/cell', remaining: null, cooldown: null, selected: true, disabled: false },
        { type: 'retardant', name: 'Air tanker drop', icon: '✈️', desc: 'Retardant coats a 5×5 patch: spread through it drops ~85% and slowly weakens.', cost: '5 pts', remaining: 4, cooldown: 0, selected: false, disabled: false },
        { type: 'engine', name: 'Engine crew', icon: '🚒', desc: 'Station an engine in a neighborhood: fire entering it slows and only 15% of reached homes are lost.', cost: '6 pts', remaining: 2, cooldown: null, selected: false, disabled: false },
        { type: 'evacuate', name: 'Evacuation order', icon: '📢', desc: 'Empty a neighborhood: no injuries if fire reaches it; trust dips if it never did.', cost: 'free', remaining: null, cooldown: null, selected: false, disabled: false },
        { type: 'mutual_aid', name: 'Call mutual aid', icon: '📞', desc: 'Neighboring counties send crews: +10 crew points now, $1.5M from the budget.', cost: '$1.5M', remaining: 1, cooldown: null, selected: false, disabled: false }
      ],
      threat: { headline: 'Fire running NE at 14 mph — Marshall Heights 6 cells away', rows: [{ label: 'Acres', value: '1,240', bad: true }, { label: 'Intensity', value: 'Running', bad: true }, { label: 'Wind', value: '14 mph SW' }, { label: 'Homes at risk', value: '38', bad: true }, { label: 'Homes lost', value: '0' }, { label: 'Above reservoir', value: '410 ac', bad: true }],
        threatened: [{ name: 'Marshall Heights', type: 'neighborhood', distance: 6, burning: false }, { name: 'Kestrel Divide', type: 'forest', distance: 0, burning: true }, { name: 'Lazy J Ranch', type: 'farm', distance: 9, burning: false }, { name: 'Old Mill', type: 'neighborhood', distance: 14, burning: false }] },
      hint: 'Drag on the map to cut a line' };
  }
  function stormSpec() {
    return { mode: 'storm', title: 'FLASH FLOOD — 2.2 in', subtitle: 'Rain on the Troublesome Bench scar · peak expected in 12 frames', step: 3, maxSteps: 40, paused: false, speed: 1,
      points: { label: 'Emergency fund', value: 1.9, max: 2.5, unit: '$M' },
      tools: [
        { type: 'sandbag', name: 'Sandbag line', icon: '🧱', desc: 'Protects this cell and its 4 neighbours: flood threshold ×2.5. Placed before the water arrives = full effect; after = 40%.', cost: '$0.04M/cell', remaining: null, cooldown: null, selected: true, disabled: false },
        { type: 'pump', name: 'Pump crew', icon: '🔧', desc: 'Clears a flooded street or basement: damage on this cell ×0.4.', cost: '$0.15M', remaining: 3, cooldown: null, selected: false, disabled: false },
        { type: 'evacuate', name: 'Evacuate', icon: '📢', desc: 'Empty a neighborhood: injury risk there ×0.1; trust dips if no water ever arrived.', cost: 'free', remaining: null, cooldown: null, selected: false, disabled: false },
        { type: 'spillway', name: 'Emergency release', icon: '🌊', desc: 'Open the dam gates early: the reservoir swallows the pulse (peak below dam ×0.6) but you dump 1,500 AF and farms downstream see a surge.', cost: 'free · once', remaining: 1, cooldown: null, selected: false, disabled: false }
      ],
      threat: { headline: 'Debris flow reaching Riverbend — 3 streets under water', rows: [{ label: 'Rain so far', value: '0.8 in' }, { label: 'Peak at town', value: '1,410 cfs', bad: true }, { label: 'Flooded cells', value: '42', bad: true }, { label: 'Homes flooded', value: '2', bad: true }, { label: 'Sediment', value: '2,100 t' }, { label: 'Reservoir', value: '61% turbid', bad: true }],
        threatened: [{ name: 'Riverbend', type: 'neighborhood', distance: 0, burning: true }, { name: 'Two Rivers Farm', type: 'farm', distance: 3, burning: false }, { name: 'Old Mill', type: 'neighborhood', distance: 7, burning: false }] },
      hint: 'Drag on the map to lay sandbags' };
  }
  function stopTac() { if (tac.timer) { clearInterval(tac.timer); tac.timer = null; } }
  function runTac(spec) {
    stopTac(); tac.spec = spec;
    WS.UI.showTactical(spec);
    WS.UI.alert(spec.mode === 'fire' ? 'WILDFIRE — Kestrel Divide is burning!' : 'FLASH FLOOD — rain on the burn scar!', spec.mode === 'fire' ? 'fire' : 'flood');
    tac.timer = setInterval(function () {
      var sp = tac.spec; if (!sp) return;
      if (WS.UI.els.tactical.hidden) { stopTac(); return; }
      if (sp.paused) return;
      sp.step += sp.speed;
      if (sp.mode === 'fire') {
        var acres = 1240 + sp.step * 55; sp.title = 'WILDFIRE — ' + acres.toLocaleString() + ' acres';
        sp.points.value = Math.min(sp.points.max, sp.points.value + 0.3 * sp.speed);
        var rt = sp.tools[1]; if (rt.cooldown > 0) rt.cooldown = Math.max(0, rt.cooldown - sp.speed);
        sp.threat.rows[0].value = acres.toLocaleString();
        sp.threat.threatened.forEach(function (z) { if (!z.burning && z.distance > 0) z.distance = Math.max(0, z.distance - (sp.step % 3 === 0 ? 1 : 0)); if (z.distance === 0 && !z.burning) { z.burning = true; WS.UI.alert('Fire has reached ' + z.name + '!', 'bad'); } });
        var mh = sp.threat.threatened[0]; sp.threat.headline = mh.burning ? 'Fire is inside Marshall Heights — engines holding' : 'Fire running NE at 14 mph — Marshall Heights ' + mh.distance + ' cells away';
        if (sp.step === 12) WS.UI.alert('Dozer line holding on the west flank', 'good');
      } else {
        sp.threat.rows[2].value = String(42 + sp.step * 4);
        if (sp.step === 9) WS.UI.alert('Sandbag line holding at Riverbend', 'good');
      }
      WS.UI.updateTactical(sp);
      if (sp.step >= sp.maxSteps) { stopTac(); WS.UI.hideTactical(); WS.UI.setPhase('plan'); showAA(sp.mode); }
    }, 500);
  }
  function showAA(mode) {
    var rep = mode === 'storm' ? { mode: 'storm', title: 'The Riverbend flood', headline: 'A 2.2-inch storm on the Troublesome Bench scar ran 1,410 cfs through town. Your sandbags and pumps held the worst of it out of the houses.',
        stats: [{ label: 'Damage', value: '$1.2M', bad: true }, { label: 'Homes flooded', value: '4', bad: true }, { label: 'Injury risk', value: 'Low' }, { label: 'Sediment to reservoir', value: '3,900 t', bad: true }],
        actions: ['Laid 14 cells of sandbag line along Mill Street before the water arrived', 'Stationed 2 pump crews in Riverbend', 'Evacuated Riverbend (water did arrive — no injuries)'],
        counterfactual: { without: [{ label: 'Damage', value: '$3.4M' }, { label: 'Homes flooded', value: '11' }, { label: 'Injury risk', value: 'High' }], with: [{ label: 'Damage', value: '$1.2M' }, { label: 'Homes flooded', value: '4' }, { label: 'Injury risk', value: 'Low' }], summary: 'Without your sandbags and pumps: $3.4M damage and 11 homes flooded. With them: $1.2M and 4 homes.' },
        lessons: ['Sandbags placed before the water arrives are 2.5× as effective as ones placed after.', 'Evacuation costs nothing when the water comes — and a little trust when it does not.'] }
      : { mode: 'fire', title: 'The Kestrel Divide fire', headline: 'A running crown fire pushed by 14 mph winds toward Marshall Heights. Your dozer line and two retardant drops turned it before it reached the subdivision.',
        stats: [{ label: 'Burned', value: '1,900 acres', bad: true }, { label: 'Homes lost', value: '2', bad: true }, { label: 'Above reservoir', value: '640 acres', bad: true }, { label: 'Injuries', value: '0' }, { label: 'Crew points spent', value: '27' }],
        actions: ['Cut 22 cells of dozer line on the NE flank (held)', 'Two air-tanker drops ahead of the head', 'Stationed an engine crew in Marshall Heights', 'Evacuated Marshall Heights (fire did reach it — no injuries)'],
        counterfactual: { without: [{ label: 'Acres burned', value: '4,600' }, { label: 'Homes lost', value: '11' }, { label: 'Above reservoir', value: '1,900 acres' }], with: [{ label: 'Acres burned', value: '1,900' }, { label: 'Homes lost', value: '2' }, { label: 'Above reservoir', value: '640 acres' }], summary: 'Without your line and 2 drops: 4,600 acres and 11 homes. With them: 1,900 acres and 2 homes.' },
        lessons: ['A finished dozer line stops almost everything; a half-dug one stops nothing — start early.', 'Every acre saved above the reservoir is sediment that never reaches the intake.'] };
    WS.UI.showAfterAction(rep).then(function () { say('after-action closed'); });
  }
  btn('Tactical: fire', function () { runTac(fireSpec()); });
  btn('Tactical: storm', function () { runTac(stormSpec()); });

  /* ---- v3: advisor speech bubbles (what main.js shows when a 3D avatar is clicked) ---- */
  var bub = { timer: null, t: 0, i: 0 };
  function stopBubbleOrbit() { if (bub.timer) { clearInterval(bub.timer); bub.timer = null; } }
  function showAdvisorBubble(i) {
    var ch = WS.Advisors.CHARACTERS[i % WS.Advisors.CHARACTERS.length], rec = game.getAdvisors('budget').filter(function (r) { return r.characterId === ch.id; })[0];
    var text = rec ? (rec.headline.replace(/[.!?]?$/, '.') + ' ' + WS.UI.firstSentence(rec.text)) : 'Nothing to add right now — ask me again next season.';
    WS.UI.showBubble({ id: ch.id, name: ch.name, role: ch.role, color: ch.color, avatarEmoji: ch.avatarEmoji, text: text,
      actions: [{ label: 'Full advice', onClick: function () { WS.UI.hideBubble(); game.openEvidence('budget'); } }, { label: 'Ask again', onClick: function () { bub.i++; showAdvisorBubble(bub.i); } }],
      onClose: function (why) { say('bubble closed (' + why + ')'); if (why !== 'replaced') stopBubbleOrbit(); } });
  }
  btn('Bubble', function () { stopBubbleOrbit(); showAdvisorBubble(bub.i); WS.UI.moveBubble(window.innerWidth * 0.5, window.innerHeight * 0.55, true); });
  btn('Bubble: orbit', function () {
    stopBubbleOrbit(); showAdvisorBubble(bub.i);
    bub.timer = setInterval(function () {
      bub.t += 0.02; var cx = window.innerWidth / 2, cy = window.innerHeight / 2;
      var x = cx + Math.cos(bub.t) * cx * 0.9, y = cy + Math.sin(bub.t * 1.3) * cy * 0.9;   /* runs to the edges: exercises clamping + tail + flip */
      WS.UI.moveBubble(x, y, Math.sin(bub.t * 0.5) > -0.85);                                  /* briefly "behind the camera" → hidden */
    }, 16);
  });
  btn('Bubble: hide', function () { stopBubbleOrbit(); WS.UI.hideBubble(); });
